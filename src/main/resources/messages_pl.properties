legal.terms.content=<h2>1. Akceptacja regulaminu</h2><p>Korzystaj\u0105c ze strony internetowej i us\u0142ug Albion EDU, akceptujesz niniejszy Regulamin. Je\u015bli nie zgadzasz si\u0119 z kt\u00f3rymkolwiek z jego postanowie\u0144, prosimy o niekorzystanie z naszych us\u0142ug.</p><h2>2. Opis us\u0142ug</h2><p>Albion EDU oferuje kursy j\u0119zykowe online oraz grupowe w j\u0119zyku angielskim, polskim i ukrai\u0144skim, wraz z powi\u0105zanymi materia\u0142ami edukacyjnymi, tre\u015bciami na blogu oraz sklepem z materia\u0142ami do nauki.</p><h2>3. Rejestracja konta</h2><p>Aby uzyska\u0107 dost\u0119p do niekt\u00f3rych funkcji, musisz za\u0142o\u017cy\u0107 konto. Jeste\u015b odpowiedzialny/a za zachowanie poufno\u015bci danych logowania oraz za wszelkie dzia\u0142ania podejmowane w ramach Twojego konta. Zobowi\u0105zujesz si\u0119 do podania dok\u0142adnych i kompletnych informacji podczas rejestracji.</p><h2>4. Zapisy na kurs i p\u0142atno\u015bci</h2><ul><li>Ceny kurs\u00f3w i materia\u0142\u00f3w s\u0105 podane na naszej stronie i mog\u0105 ulec zmianie w dowolnym momencie.</li><li>P\u0142atno\u015b\u0107 musi zosta\u0107 dokonana przed uzyskaniem dost\u0119pu do kursu lub produktu, chyba \u017ce uzgodniono inaczej.</li><li>Jeste\u015b odpowiedzialny/a za wszelkie op\u0142aty naliczane przez Tw\u00f3j bank lub dostawc\u0119 p\u0142atno\u015bci.</li></ul><h2>5. Zasady korzystania</h2><p>Korzystaj\u0105c z naszych us\u0142ug, zobowi\u0105zujesz si\u0119

