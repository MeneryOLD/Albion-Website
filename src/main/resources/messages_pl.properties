legal.privacy.content=<h2>Wprowadzenie</h2><p>Dbamy o Twoj\u0105 prywatno\u015b\u0107. Zbieramy i przetwarzamy Twoje dane tylko i wy\u0142\u0105cznie, je\u017celi jest to konieczne do prawid\u0142owego \u015bwiadczenia us\u0142ugi. Mo\u017cesz skontaktowa\u0107 si\u0119 z nami pisz\u0105c na adres e-mail: <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> lub telefonicznie: <a href="tel:+48574065884">574 065 884</a>.</p><p>Zgodnie z RODO, poni\u017cej przedstawiamy Ci zasady przetwarzania danych stosowane przez Administratora.</p><h2>I. Kim jest Administrator danych?</h2><p>Administratorem danych jest Lc Albion Olena Kiriushkina (NIP: 1251785312, REGON: 541427716), z siedzib\u0105 przy ul. Kruczej, Warszawa, 00-526 Polska.</p><h2>II. W jakim celu zbieramy Twoje dane? Jak d\u0142ugo je przetwarzamy?</h2><p>Mo\u017cemy przetwarza\u0107 Twoje dane w nast\u0119puj\u0105cych celach:</p><h3>Komunikacja z Tob\u0105</h3><p>W tym udzielanie odpowiedzi na pytania przekazane przez formularz kontaktowy, wiadomo\u015b\u0107 e-mail, w ramach prowadzonych spotka\u0144 on-line itp. Dane b\u0119d\u0105 przetwarzane w oparciu o uzasadniony interes Administratora w postaci komunikacji z U\u017cytkownikami Strony (art. 6 ust. 1 lit. f RODO). Twoje dane b\u0119d\u0105 przetwarzane nie d\u0142u\u017cej ni\u017c do czasu wniesienia przez Ciebie sprzeciwu lub ustania celu biznesowego. Podanie tych danych jest dobrowolne, ale niezb\u0119dne do komunikacji z Tob\u0105. Dane mog\u0105 by\u0107 tak\u017ce przetwarzane w celu archiwizacji do cel\u00f3w wewn\u0119trznych w oparciu o uzasadniony interes Administratora (art. 6 ust. 1 lit. f RODO) do czasu wniesienia sprzeciwu lub ustania celu biznesowego.</p><h3>Zawarcie i realizacja umowy</h3><p>Zawarcie umowy i jej realizacja (z\u0142o\u017cenie zam\u00f3wienia); ustalenie, obrona i dochodzenie roszcze\u0144; realizacja obowi\u0105zk\u00f3w prawnych ci\u0105\u017c\u0105cych na Administratorze (m.in. obowi\u0105zk\u00f3w podatkowych i archiwizacyjnych).</p><p>Dane niezb\u0119dne do zawarcia i realizacji umowy b\u0119d\u0105 przetwarzane przez czas realizacji umowy, w tym przez czas realizacji uprawnie\u0144 wynikaj\u0105cych z umowy, jak np. prawo do reklamacji z tytu\u0142u r\u0119kojmi (art. 6 ust. 1 lit. b i f RODO). Podanie tych danych jest dobrowolne, ale niezb\u0119dne do zawarcia i realizacji umowy.</p><p>Dane dodatkowe podane w celu m.in. usprawnienia realizacji umowy b\u0119d\u0105 przetwarzane nie d\u0142u\u017cej ni\u017c do czasu wniesienia przez Ciebie sprzeciwu lub ustania celu biznesowego w oparciu o uzasadniony interes w postaci obs\u0142ugi Klient\u00f3w (art. 6 ust. 1 lit. f RODO).</p><p>Po tym okresie dane b\u0119d\u0105 przetwarzane przez okres przedawnienia roszcze\u0144 w oparciu o uzasadniony interes Administratora w celu obrony przed roszczeniami, a tak\u017ce w celu ustalenia i dochodzenia roszcze\u0144 (art. 6 ust. 1 lit. f RODO).</p><p>W przypadku gdy dane s\u0105 niezb\u0119dne do realizacji obowi\u0105zk\u00f3w prawnych ci\u0105\u017c\u0105cych na Administratorze (jak np. wystawianie i przechowywanie faktur) \u2013 dane b\u0119d\u0105 przetwarzane w tym celu nie d\u0142u\u017cej ni\u017c przez 6 lat (obowi\u0105zki archiwizacyjne dot. dokument\u00f3w ksi\u0119gowych), chyba \u017ce przepisy prawa wymagaj\u0105 d\u0142u\u017cszego okresu (art. 6 ust. 1 lit. c RODO).</p><p>Dane mog\u0105 by\u0107 tak\u017ce archiwizowane do cel\u00f3w wewn\u0119trznych i statystycznych do czasu wniesienia przez Ciebie sprzeciwu lub ustania celu biznesowego w oparciu o uzasadniony interes Administratora (art. 6 ust. 1 lit. f RODO).</p><h3>Informacje marketingowe/handlowe</h3><p>Dostarczanie informacji marketingowych/handlowych (dalej jako Informacje marketingowe), w tym m.in. wysy\u0142ka newslettera oraz informacji o us\u0142ugach, produktach, promocjach, darmowych tre\u015bciach za pomoc\u0105 innych narz\u0119dzi (np. sms, telefon).</p><p>Dane b\u0119d\u0105 przetwarzane w oparciu o uzasadniony interes Administratora, w postaci marketingu produkt\u00f3w i us\u0142ug Administratora (art. 6 ust. 1 lit. f RODO). Zgodnie z art. 398 ustawy Prawo komunikacji elektronicznej, w celach utrzymania komunikacji handlowej / marketingowej, konieczna jest Twoja zgoda. Mo\u017cesz j\u0105 w ka\u017cdej chwili wycofa\u0107:</p><ul><li>klikaj\u0105c link w stopce maila lub pisz\u0105c do nas na adres <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u2013 w przypadku wysy\u0142ki wiadomo\u015bci w formie e-mail,</li><li>kontakt bezpo\u015bredni na numer <a href="tel:+48574065884">574 065 884</a> lub adres e-mail <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u2013 w przypadku wyra\u017cenia zgody na otrzymywanie tre\u015bci handlowych/marketingowych poprzez rozmow\u0119 telefoniczn\u0105 i/lub SMS.</li></ul><p>Podanie danych jest dobrowolne, jednak niezb\u0119dne do otrzymywania Informacji marketingowych. Rezygnacja z otrzymywania Informacji marketingowych uniemo\u017cliwia przekazywanie Ci Informacji marketingowych.</p><p>Dane przetwarzane w zwi\u0105zku z udzielon\u0105 przez Ciebie zgod\u0105 na dostarczanie Informacji marketingowych, w tym m.in. dane zebrane automatycznie (np. adres IP), b\u0119d\u0105 tak\u017ce przetwarzane w oparciu o uzasadniony interes Administratora (art. 6 ust. 1 lit. f RODO) polegaj\u0105cy na analizie zachowa\u0144 w celu optymalizacji dzia\u0142a\u0144 marketingowych. Dane b\u0119d\u0105 przetwarzane do cel\u00f3w analitycznych i statystycznych.</p><p>Twoje dane mog\u0105 by\u0107 r\u00f3wnie\u017c archiwizowane na potrzeby ewentualnego ustalenia, dochodzenia lub obrony roszcze\u0144, w tym w celu zapewnienia mo\u017cliwo\u015bci wykazania, \u017ce dzia\u0142ania marketingowe prowadzone by\u0142y zgodnie z prawem w oparciu o art. 6 ust. 1 lit. f RODO.</p><p>Dane przetwarzane w oparciu o art. 6 ust. 1 lit. f RODO b\u0119d\u0105 przetwarzane nie d\u0142u\u017cej ni\u017c do czasu wniesienia przez Ciebie sprzeciwu lub ustania celu biznesowego \u2013 w zale\u017cno\u015bci od tego, co nast\u0105pi wcze\u015bniej.</p><h3>Platformy spo\u0142eczno\u015bciowe</h3><p>Administrowanie i zarz\u0105dzanie stron\u0105 i grupami na platformach spo\u0142eczno\u015bciowych (m.in. Meta, Instagram) w przypadku przetwarzania danych na platformach spo\u0142eczno\u015bciowych, w tym komunikacji z Tob\u0105, kierowania do Ciebie tre\u015bci marketingowych.</p><p>Dane te b\u0119d\u0105 przetwarzane wy\u0142\u0105cznie wtedy, gdy zdecydujesz si\u0119 na polubienie strony / do\u0142\u0105czenie do grupy / wybranie opcji \u201eObserwuj\u201d lub w inny spos\u00f3b zostawisz swoje dane na platformie zarz\u0105dzanej przeze mnie, np. w formie umieszczenia wpisu lub komentarza. Dane b\u0119d\u0105 przetwarzane przez okres istnienia strony/grupy lub do czasu wniesienia przez Ciebie sprzeciwu, co mo\u017ce nast\u0105pi\u0107 poprzez odklikni\u0119cie opcji \u201eLubi\u0119 to\u201d, \u201eObserwuj\u201d, usuni\u0119cie komentarza/wpisu lub w inny spos\u00f3b przewidziany w ramach platformy/strony lub poprzez skontaktowanie si\u0119 ze mn\u0105.</p><p>Zasady odnosz\u0105ce si\u0119 do strony/fanpage\u2019a/grupy ustala Administrator, natomiast zasady korzystania z portalu spo\u0142eczno\u015bciowego, na kt\u00f3rym umieszczona jest strona/fanpage/grupa, ustala podmiot zarz\u0105dzaj\u0105cy tymi portalami.</p><h3>Komentarze</h3><p>W stosunku do danych widocznych na naszej Stronie przy zamieszczonym komentarzu, dane te s\u0105 przetwarzane przez nas w celu administrowania Stron\u0105 i jej obs\u0142ugi oraz komunikacji z Tob\u0105 w oparciu o uzasadniony interes Administratora (art. 6 ust. 1 lit. f) przez czas niezb\u0119dny do realizacji cel\u00f3w biznesowych lub wniesienia sprzeciwu.</p><h3>Dane wra\u017cliwe</h3><p>Dane wra\u017cliwe s\u0105 zbierane w celu realizacji umowy i jej prawid\u0142owego wykonywania w oparciu o Twoj\u0105 \u015bwiadom\u0105 i dobrowoln\u0105 zgod\u0119 (art. 9 ust. 2 lit. a RODO) \u2013 do czasu ustania celu biznesowego lub cofni\u0119cia zgody. Podanie danych jest dobrowolne, ale jest niezb\u0119dne do prawid\u0142owej realizacji umowy (np. informacje o poziomie j\u0119zykowym).</p><h2>III. Komu mo\u017cemy przekaza\u0107 Twoje dane?</h2><p>Przekazujemy Twoje dane innym podmiotom tylko wtedy, gdy jest to niezb\u0119dne do realizacji cel\u00f3w przetwarzania, o kt\u00f3rych mowa w punkcie II.</p><p>W razie potrzeby Twoje dane mog\u0105 by\u0107 przekazane podmiotom, z kt\u00f3rymi wsp\u00f3\u0142pracujemy przy realizacji ww. cel\u00f3w: firmie hostingowej, firmie informatycznej/podmiotowi zarz\u0105dzaj\u0105cemu stron\u0105, firmie \u015bwiadcz\u0105cej us\u0142ugi rachunkowo-ksi\u0119gowe, firmie udost\u0119pniaj\u0105cej program do faktur, firmie udost\u0119pniaj\u0105cej program do zarz\u0105dzania szko\u0142\u0105 (CRM), firmie \u015bwiadcz\u0105cej us\u0142ugi newslettera, firmie \u015bwiadcz\u0105cej us\u0142ugi chmurowe, agencji reklamowej, wirtualnej asystentce, podwykonawcom, prawnikom, kurierom lub operatorom pocztowym, platformie szkoleniowej, platformie do obs\u0142ugi klient\u00f3w oraz innym podmiotom wspieraj\u0105cym nas w realizacji cel\u00f3w przetwarzania.</p><p>Co do zasady dane nie b\u0119d\u0105 przekazywane poza obszar EOG. W sytuacji gdy jednak b\u0119d\u0105 przekazane poza EOG, nast\u0105pi to w oparciu o Twoj\u0105 zgod\u0119, standardowe klauzule umowne lub w oparciu o inne zabezpieczenia przewidziane w RODO po spe\u0142nieniu m.in. obowi\u0105zku informacyjnego. Twoje dane mog\u0105 by\u0107 przekazane:</p><ul><li>Google LLC, 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA</li><li>HubSpot, 25 First Street, 2nd Floor, Cambridge, MA 02141, USA</li><li>Dropbox International Unlimited Company, One Park Place, Floor 5, Upper Hatch Street, Dublin</li><li>Canva, 110 Kippax St, Level 1, Surry Hills, NSW 2010, Australia</li></ul><h2>IV. Jakie prawa Ci przys\u0142uguj\u0105?</h2><p>W zwi\u0105zku z RODO przys\u0142uguje Ci prawo:</p><ul><li>dost\u0119pu do swoich danych osobowych,</li><li>sprostowania danych osobowych,</li><li>usuni\u0119cia danych osobowych,</li><li>ograniczenia przetwarzania danych osobowych,</li><li>sprzeciwu wobec przetwarzania danych osobowych,</li><li>przenoszenia danych osobowych,</li><li>cofni\u0119cia zgody; wycofanie zgody nie wp\u0142ywa na zgodno\u015b\u0107 z prawem przetwarzania dokonanego przed jej cofni\u0119ciem.</li></ul><p>Je\u017celi uwa\u017casz, \u017ce Twoje dane osobowe s\u0105 przetwarzane niezgodnie z obowi\u0105zuj\u0105cym prawem, przys\u0142uguje Ci skarga do Prezesa Urz\u0119du Ochrony Danych Osobowych. W takim przypadku zach\u0119camy jednak do wcze\u015bniejszego kontaktu z nami celem wyja\u015bnienia swoich w\u0105tpliwo\u015bci.</p><h2>V. Przepisy prawa obowi\u0105zuj\u0105ce w zakresie danych osobowych</h2><p>W sprawach nieuregulowanych stosuje si\u0119 w\u0142a\u015bciwe przepisy prawa, w tym prawa europejskiego, w szczeg\u00f3lno\u015bci RODO.</p><h2>VI. Polityka plik\u00f3w cookies</h2><p>Administrator stosuje technologie obserwuj\u0105ce dzia\u0142ania podejmowane przez U\u017cytkownika w ramach Strony:</p><ul><li>piksel konwersji Facebooka (Meta) \u2013 w celu zarz\u0105dzania reklamami na Meta i prowadzenia dzia\u0142a\u0144 remarketingowych;</li><li>kod Google Analytics \u2013 w celu analizy statystyk Strony;</li><li>Google LLC;</li><li>Vimeo Inc.;</li><li>TikTok FTechnology Limited.</li></ul><p>Google Analytics korzysta z w\u0142asnych plik\u00f3w cookies do analizowania dzia\u0142a\u0144 i zachowa\u0144 U\u017cytkownik\u00f3w Strony. Pliki te s\u0142u\u017c\u0105 do przechowywania informacji, np. z jakiej strony U\u017cytkownik trafi\u0142 na bie\u017c\u0105c\u0105 stron\u0119 internetow\u0105. Pomagaj\u0105 udoskonali\u0107 Stron\u0119.</p><p>Strona nie zbiera w spos\u00f3b automatyczny \u017cadnych informacji, z wyj\u0105tkiem informacji zawartych w plikach cookies.</p><p>Pliki cookies (tzw. \u201eciasteczka\u201d) stanowi\u0105 dane informatyczne, w szczeg\u00f3lno\u015bci pliki tekstowe, kt\u00f3re przechowywane s\u0105 w urz\u0105dzeniu ko\u0144cowym U\u017cytkownika Strony i przeznaczone s\u0105 do korzystania ze Strony. Cookies zazwyczaj zawieraj\u0105 nazw\u0119 strony internetowej, z kt\u00f3rej pochodz\u0105, czas przechowywania ich na urz\u0105dzeniu ko\u0144cowym oraz unikalny numer.</p><p>Pliki cookies wykorzystywane s\u0105 w celu dostosowania zawarto\u015bci Strony do preferencji U\u017cytkownika oraz optymalizacji korzystania ze Strony; tworzenia statystyk, kt\u00f3re pomagaj\u0105 zrozumie\u0107, w jaki spos\u00f3b U\u017cytkownicy korzystaj\u0105 ze Strony, co umo\u017cliwia ulepszanie jej struktury i zawarto\u015bci.</p><p>Mo\u017cesz dokona\u0107 samodzielnie zmian w ustawieniach dotycz\u0105cych plik\u00f3w cookies. W wielu przypadkach przegl\u0105darka internetowa domy\u015blnie dopuszcza przechowywanie plik\u00f3w cookies w urz\u0105dzeniu ko\u0144cowym U\u017cytkownika. Szczeg\u00f3\u0142owe informacje o mo\u017cliwo\u015bci i sposobach obs\u0142ugi plik\u00f3w cookies dost\u0119pne s\u0105 w ustawieniach oprogramowania (przegl\u0105darki internetowej).</p><p>Brak wyra\u017cenia zgody na pliki cookies mo\u017ce ogranicza\u0107 dzia\u0142anie niekt\u00f3rych funkcjonalno\u015bci na Stronie.</p><h2>VII. Wtyczki spo\u0142eczno\u015bciowe</h2><p>Na Stronie u\u017cywane s\u0105 wtyczki i inne narz\u0119dzia spo\u0142eczno\u015bciowe udost\u0119pniane przez portale takie jak: Facebook, Google, Instagram, TikTok, LinkedIn. Zasady dotycz\u0105ce przetwarzania danych osobowych opisane s\u0105 bezpo\u015brednio na stronach us\u0142ugodawc\u00f3w tych portali spo\u0142eczno\u015bciowych.</p><h2>VIII. Wsp\u00f3\u0142administrowanie</h2><p>Administratorem danych przetwarzanych na potrzeby statystyk zbieranych w ramach platformy Facebook (Meta) jest Lc Albion Olena Kiriushkina, zwana dalej Administratorem, oraz Meta Platforms Ireland Limited, z siedzib\u0105 pod adresem 4 Grand Canal Square, Grand Canal Harbour, Dublin 2, Irlandia, zwana dalej Wsp\u00f3\u0142administratorem. Dane te s\u0105 przetwarzane w oparciu o wsp\u00f3\u0142administrowanie przez ww. podmioty. Szczeg\u00f3\u0142owe zasady dotycz\u0105ce wsp\u00f3\u0142administrowania danymi, w tym informacje o przys\u0142uguj\u0105cych prawach, opisane zosta\u0142y na stronie Informacje o statystykach strony.</p><p>Administrator przetwarza dane w oparciu o uzasadniony interes Administratora polegaj\u0105cy na prowadzeniu analiz aktywno\u015bci U\u017cytkownik\u00f3w, a tak\u017ce ich preferencji, w celu poprawy stosowanych funkcjonalno\u015bci i \u015bwiadczonych us\u0142ug. W sprawach dotycz\u0105cych danych osobowych mo\u017cna kontaktowa\u0107 si\u0119 zar\u00f3wno z Administratorem, jak i Wsp\u00f3\u0142administratorem.</p><h2>Klauzula informacyjna</h2><p>Realizuj\u0105c obowi\u0105zek informacyjny wynikaj\u0105cy z przepis\u00f3w ustawy o \u015bwiadczeniu us\u0142ug drog\u0105 elektroniczn\u0105, a tak\u017ce ustawy z dnia 30 maja 2014 r. o prawach konsumenta oraz przepis\u00f3w RODO, poni\u017cej przesy\u0142amy najwa\u017cniejsze informacje.</p><h3>Obowi\u0105zek informacyjny wynikaj\u0105cy z RODO</h3><p>Administratorem danych osobowych jest Lc Albion Olena Kiriushkina (NIP: 1251785312, REGON: 541427716), z siedzib\u0105 przy ul. Kruczej 16/22, Warszawa, 00-526 Polska, zwana dalej Organizatorem. Mo\u017cesz skontaktowa\u0107 si\u0119 z Organizatorem pisz\u0105c na adres e-mail: <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> lub telefonicznie: <a href="tel:+48574065884">574 065 884</a>.</p><p>Dane b\u0119d\u0105 przetwarzane:</p><ul><li>w celu zawarcia umowy oraz jej wykonywania (art. 6 ust. 1 lit. b RODO); w przypadku podania dodatkowych danych, kt\u00f3re mog\u0105 usprawni\u0107 realizacj\u0119 umowy \u2013 przetwarzanie b\u0119dzie odbywa\u0142o si\u0119 w oparciu o uzasadniony interes Administratora do czasu ustania celu biznesowego lub wniesienia sprzeciwu (art. 6 ust. 1 lit. f RODO);</li><li>w celu wype\u0142nienia obowi\u0105zku prawnego, kt\u00f3ry ci\u0105\u017cy na Administratorze (art. 6 ust. 1 lit. c RODO), w tym m.in. przepis\u00f3w podatkowych i z zakresu rachunkowo\u015bci oraz przepis\u00f3w ustawy z dnia 13 maja 2016 r. o przeciwdzia\u0142aniu zagro\u017ceniom przest\u0119pczo\u015bci\u0105 na tle seksualnym i ochronie ma\u0142oletnich, w zwi\u0105zku z gromadzeniem dokumentacji zwi\u0105zanych z realizacj\u0105 czynno\u015bci maj\u0105cych na celu ochron\u0119 ma\u0142oletnich, w szczeg\u00f3lno\u015bci dotycz\u0105cych m.in. przyjmowania zg\u0142osze\u0144 o zdarzeniach zagra\u017caj\u0105cych ma\u0142oletniemu i udzielenia mu wsparcia, udokumentowania i przechowywania ujawnionych lub zg\u0142oszonych incydent\u00f3w lub zdarze\u0144 zagra\u017caj\u0105cych dobru ma\u0142oletniego. Dzia\u0142ania dotycz\u0105ce ochrony ma\u0142oletnich realizowane s\u0105 tak\u017ce ze wzgl\u0119d\u00f3w zwi\u0105zanych z wa\u017cnym interesem publicznym zgodnie z art. 9 ust. 2 lit. b RODO;</li><li>w celu realizacji prawnie uzasadnionego interesu Administratora (m.in. w postaci ustalenia lub dochodzenia roszcze\u0144/obrony przed roszczeniami/marketingu us\u0142ug i produkt\u00f3w firmy, opinii) \u2013 tj. do czasu przedawnienia roszcze\u0144/ustania celu biznesowego lub wniesienia sprzeciwu.</li></ul><p>Do realizacji ww. cel\u00f3w dane mog\u0105 by\u0107 powierzone m.in. firmie hostingowej, firmie \u015bwiadcz\u0105cej us\u0142ugi rachunkowo-ksi\u0119gowe, osobom prowadz\u0105cym zaj\u0119cia, platformie do obs\u0142ugi klient\u00f3w, kurierom, urz\u0119dom pocztowym, prawnikowi.</p><p>Maj\u0105 Pa\u0144stwo prawo \u017c\u0105dania dost\u0119pu do swoich danych osobowych, sprostowania, usuni\u0119cia lub ograniczenia przetwarzania danych oraz sprzeciwu wobec przetwarzania, a tak\u017ce prawo do przenoszenia danych oraz prawo do wniesienia skargi do organu nadzorczego. Zgod\u0119 mo\u017cna wycofa\u0107 w dowolnym momencie bez wp\u0142ywu na zgodno\u015b\u0107 z prawem przetwarzania dokonanego przed jej wycofaniem. W zakresie, w jakim przetwarzanie danych nast\u0119puje w celu zawarcia i realizacji umowy lub dla cel\u00f3w realizacji obowi\u0105zk\u00f3w prawnych czy ustalenia/dochodzenia lub obrony przed roszczeniami, podanie danych jest dobrowolne, ale mo\u017ce uniemo\u017cliwia\u0107 zawarcie umowy (nie dotyczy danych fakultatywnych).</p><h3>Obowi\u0105zek informacyjny wynikaj\u0105cy z ustawy o \u015bwiadczeniu us\u0142ug drog\u0105 elektroniczn\u0105 oraz ustawy o prawach konsumenta</h3><p>Publiczny charakter sieci Internet i korzystanie z us\u0142ug \u015bwiadczonych drog\u0105 elektroniczn\u0105 mo\u017ce wi\u0105za\u0107 si\u0119 z zagro\u017ceniem pozyskania i modyfikowania danych przez osoby nieuprawnione, dlatego nale\u017cy stosowa\u0107 w\u0142a\u015bciwe \u015brodki techniczne minimalizuj\u0105ce opisane zagro\u017cenia, w szczeg\u00f3lno\u015bci programy antywirusowe i chroni\u0105ce to\u017csamo\u015b\u0107. Organizator nie zwraca si\u0119 z pro\u015bb\u0105 o udost\u0119pnienie mu w jakiejkolwiek formie Has\u0142a. W ramach \u015bwiadczonych us\u0142ug obowi\u0105zuje zakaz dostarczania tre\u015bci o charakterze bezprawnym. Reklamacje dotycz\u0105ce us\u0142ug \u015bwiadczonych drog\u0105 elektroniczn\u0105 mo\u017cna kierowa\u0107 na adres Organizatora.</p><p>Informujemy, \u017ce w przypadku zawarcia umowy na odleg\u0142o\u015b\u0107 lub poza siedzib\u0105 Organizatora, Klientowi, kt\u00f3ry jest konsumentem lub przedsi\u0119biorc\u0105 na prawach konsumenta w rozumieniu art. 385\u2075 kodeksu cywilnego, przys\u0142uguje ustawowe prawo do odst\u0105pienia od umowy bez podania przyczyny w terminie 14 dni od dnia zawarcia umowy, z zastrze\u017ceniem poni\u017cszych wyj\u0105tk\u00f3w. W celu skorzystania z prawa do odst\u0105pienia, Klient informuje o tym wysy\u0142aj\u0105c np. e-mail lub pismo na adres Organizatora (wz\u00f3r: \u201eOdst\u0119puj\u0119 od umowy z dnia \u2026\u201d). Do zachowania terminu wa\u017cne jest wys\u0142anie informacji o odst\u0105pieniu od umowy przed jego up\u0142ywem.</p><p>Klientowi nie przys\u0142uguje ustawowe prawo do odst\u0105pienia od wsp\u00f3\u0142pracy w przypadku, gdy Organizator wykona\u0142 w pe\u0142ni us\u0142ug\u0119 lub rozpocz\u0105\u0142 \u015bwiadczenie us\u0142ugi o dostarczanie tre\u015bci cyfrowych za wyra\u017an\u0105 i uprzedni\u0105 zgod\u0105 Klienta, kt\u00f3ry zosta\u0142 poinformowany przed rozpocz\u0119ciem \u015bwiadczenia, \u017ce po spe\u0142nieniu \u015bwiadczenia utraci prawo odst\u0105pienia od wsp\u00f3\u0142pracy i przyj\u0105\u0142 to do wiadomo\u015bci. W przypadku us\u0142ugi o dostarczanie tre\u015bci cyfrowych, Organizator przekazuje Klientowi potwierdzenie otrzymania zgody.</p><p>W przypadku odst\u0105pienia od Umowy Klientowi zwr\u00f3cone zostan\u0105 wszystkie otrzymane p\u0142atno\u015bci, niezw\u0142ocznie, jednak nie p\u00f3\u017aniej ni\u017c 14 dni od dnia, w kt\u00f3rym Organizator zosta\u0142 poinformowany o odst\u0105pieniu. Zwrot p\u0142atno\u015bci dokonany zostanie przy u\u017cyciu takich samych sposob\u00f3w p\u0142atno\u015bci, jakie zosta\u0142y u\u017cyte w pierwotnej transakcji, chyba \u017ce Klient wyra\u017anie zgodzi si\u0119 na inne rozwi\u0105zanie; Klient nie poniesie \u017cadnych op\u0142at w zwi\u0105zku z tym zwrotem.</p><p>Klient mo\u017ce zwr\u00f3ci\u0107 si\u0119 do sta\u0142ego polubownego s\u0105du konsumenckiego z wnioskiem o rozstrzygni\u0119cie sporu wynik\u0142ego z umowy, wojew\u00f3dzkiego inspektora Inspekcji Handlowej z wnioskiem o wszcz\u0119cie post\u0119powania mediacyjnego, powiatowego (miejskiego) rzecznika praw konsumenta lub organizacji spo\u0142ecznej, do kt\u00f3rej statutowych zada\u0144 nale\u017cy ochrona konsument\u00f3w, i uzyska\u0107 pomoc w sprawie umowy, lub ma prawo skorzysta\u0107 z platformy ODR (<a href="http://ec.europa.eu/consumers/odr">http://ec.europa.eu/consumers/odr</a>).</p>

