legal.refund.content=<h2>1. Informacje og\u00f3lne</h2><p>Zale\u017cy nam, aby\u015b by\u0142/a zadowolony/a z nauki w Albion EDU. Niniejsza Polityka Zwrot\u00f3w wyja\u015bnia warunki, na jakich mog\u0105 zosta\u0107 przyznane zwroty za kursy, lekcje i zakupy w sklepie.</p><h2>2. Lekcje indywidualne</h2><ul><li>Je\u015bli odwo\u0142asz zaplanowan\u0105 lekcj\u0119 indywidualn\u0105 co najmniej 24 godziny wcze\u015bniej, mo\u017cesz przenie\u015b\u0107 j\u0105 na inny termin bez dodatkowych koszt\u00f3w.</li><li>Odwo\u0142ania dokonane p\u00f3\u017aniej ni\u017c 24 godziny przed lekcj\u0105 mog\u0105 nie kwalifikowa\u0107 si\u0119 do zwrotu ani zmiany terminu.</li><li>Je\u015bli lekcja zostanie odwo\u0142ana przez nauczyciela, otrzymasz mo\u017cliwo\u015b\u0107 bezp\u0142atnej zmiany terminu lub pe\u0142ny zwrot za t\u0119 lekcj\u0119.</li></ul><h2>3. Kursy grupowe</h2><ul><li>Je\u015bli zrezygnujesz z zapisu przed rozpocz\u0119ciem kursu, przys\u0142uguje Ci pe\u0142ny zwrot.</li><li>Je\u015bli zrezygnujesz w ci\u0105gu pierwszego tygodnia od rozpocz\u0119cia kursu, mo\u017ce zosta\u0107 przyznany zwrot cz\u0119\u015bciowy, pomniejszony o koszt ju\u017c odbytych lekcji.</li><li>Po up\u0142ywie pierwszego tygodnia kursu grupowego zwroty nie s\u0105 dost\u0119pne.</li></ul><h2>4. Produkty cyfrowe i zakupy w sklepie</h2><p>Ze wzgl\u0119du na charakter tre\u015bci cyfrowych, zakupy materia\u0142\u00f3w do pobrania, e-book\u00f3w lub kurs\u00f3w cyfrowych s\u0105 z regu\u0142y bezzwrotne po przyznaniu dost\u0119pu, chyba \u017ce produkt jest wadliwy lub znacz\u0105co niezgodny z opisem.</p><h2>5. Jak z\u0142o\u017cy\u0107 wniosek o zwrot</h2><p>Aby z\u0142o\u017cy\u0107 wniosek o zwrot, skontaktuj si\u0119 z nami pod adresem <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a>, podaj\u0105c dane zam\u00f3wienia oraz pow\u00f3d wniosku. Staramy si\u0119 rozpatrywa\u0107 wszystkie wnioski o zwrot w ci\u0105gu 5 dni roboczych.</p><h2>6. Realizacja zwrotu</h2><p>Zatwierdzone zwroty zostan\u0105 zrealizowane na pierwotn\u0105 metod\u0119 p\u0142atno\u015bci w ci\u0105gu 5\u201310 dni roboczych, w zale\u017cno\u015bci od Twojego banku lub dostawcy p\u0142atno\u015bci.</p><h2>7. Wyj\u0105tki</h2><p>Zastrzegamy sobie prawo do odmowy zwrotu w przypadku stwierdzenia nadu\u017cycia niniejszej polityki, oszustwa lub naruszenia naszego Regulaminu.</p><h2>8. Zmiany w niniejszej polityce</h2><p>Mo\u017cemy okresowo aktualizowa\u0107 nasz\u0105 Polityk\u0119 Zwrot\u00f3w. Wszelkie zmiany zostan\u0105 opublikowane na tej stronie wraz z aktualn\u0105 dat\u0105 rewizji.</p><h2>9. Kontakt</h2><p>Je\u015bli masz pytania dotycz\u0105ce niniejszej Polityki Zwrot\u00f3w, skontaktuj si\u0119 z nami pod adresem <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> lub numerem <a href="tel:+48574065884">+48 574 065 884</a>.</p>
