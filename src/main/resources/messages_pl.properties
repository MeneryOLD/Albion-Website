about.teachers.title=Poznaj naszych nauczycieli
about.teachers.olena.name=Olena
about.teachers.olena.role=Za\u0142o\u017Cycielka \u00B7 Angielski
about.teachers.olena.bio=Olena Kiriushkina, edukatorka i przedsi\u0119biorczyni mieszkaj\u0105ca w Warszawie. Olena jest za\u0142o\u017Cycielk\u0105 i si\u0142\u0105 nap\u0119dow\u0105 LC Albion Olena Kiriushkina \u2014 przedsi\u0119wzi\u0119cia edukacyjnego, kt\u00F3rego celem jest poszerzanie horyzont\u00F3w poprzez specjalistyczne nauczanie. Zapewnia ukierunkowan\u0105 nauk\u0119 j\u0119zyka, pomagaj\u0105c uczniom budowa\u0107 praktyczne umiej\u0119tno\u015Bci komunikacyjne i pewno\u015B\u0107 j\u0119zykow\u0105.
about.teachers.milosz.name=Mi\u0142osz
about.teachers.milosz.role=Native speaker \u00B7 Polski
about.teachers.milosz.bio=Je\u015Bli szukasz nauczyciela naprawd\u0119 zaanga\u017Cowanego w Tw\u00F3j sukces, nie szukaj dalej ni\u017C Mi\u0142osz. Jako do\u015Bwiadczony i pe\u0142en pasji lektor j\u0119zyka polskiego, Mi\u0142osz nie tylko uczy j\u0119zyka \u2014 otwiera drzwi do zupe\u0142nie nowej kultury. Mi\u0142oszowi naprawd\u0119 zale\u017Cy na post\u0119pach ka\u017Cdej osoby, kt\u00F3r\u0105 uczy. Bierze sobie do serca Tw\u00F3j sukces, wspiera Ci\u0119 w trudno\u015Bciach w nauce i jest szczerze zaanga\u017Cowany w pomoc w osi\u0105gni\u0119ciu Twoich cel\u00F3w.
about.teachers.maksym.name=Maksym
about.teachers.maksym.role=Certyfikowany \u00B7 Ukrai\u0144ski
about.teachers.maksym.bio=Maksym jest j\u0119zykoznawc\u0105 i nauczycielem j\u0119zyka polskiego. Pracuje z uczniami na poziomach A1\u2013B2. Przygotowuje uczni\u00F3w do egzaminu TELC i specjalizuje si\u0119 w kursach przygotowawczych do pa\u0144stwowego egzaminu na poziomie B1. Czym si\u0119 pasjonuje? Jego g\u0142\u00F3wne zainteresowania to j\u0119zyki s\u0142owia\u0144skie, psychiatria i nauka w og\u00F3le.

about.faq.title=Najcz\u0119\u015Bciej zadawane pytania
about.faq.q1=Jakie poziomy Pa\u0144stwo uczycie?
about.faq.a1=Od zupe\u0142nego pocz\u0105tkuj\u0105cego (A1) do zaawansowanego (C1/C2). Ka\u017Cdy nowy ucze\u0144 wykonuje kr\u00F3tki test poziomuj\u0105cy, dzi\u0119ki czemu mo\u017Cemy dobra\u0107 odpowiedni\u0105 grup\u0119 lub u\u0142o\u017Cy\u0107 indywidualny program.
about.faq.q2=Czy prowadzicie zaj\u0119cia online?
about.faq.a2=Tak! Prowadzimy zaj\u0119cia zar\u00F3wno w naszym centrum w Warszawie, jak i w pe\u0142ni online przez Zoom. Format online realizuje ten sam program i standardy jako\u015Bci co zaj\u0119cia stacjonarne.
about.faq.q3=Po jakim czasie wida\u0107 efekty?
about.faq.a3=Wi\u0119kszo\u015B\u0107 uczni\u00F3w zauwa\u017Ca realny post\u0119p w pewno\u015Bci siebie i bieg\u0142o\u015Bci w ci\u0105gu 1\u20133 miesi\u0119cy regularnych zaj\u0119\u0107. Dok\u0142adne tempo zale\u017Cy od cz\u0119stotliwo\u015Bci lekcji i samodzielnej praktyki \u2014 prowadzimy Ci\u0119 krok po kroku.
about.faq.q4=Czy mog\u0119 przej\u015B\u0107 z grupy na lekcje indywidualne?
about.faq.a4=Oczywi\u015Bcie. Wielu uczni\u00F3w zaczyna w grupie, a p\u00F3\u017Aniej dodaje zaj\u0119cia indywidualne, aby skupi\u0107 si\u0119 na konkretnych obszarach. Wystarczy nam powiedzie\u0107, a ustalimy harmonogram dopasowany do Twoich cel\u00F3w i bud\u017Cetu.
about.faq.q5=Jaka jest Pa\u0144stwa polityka odwo\u0142ywania zaj\u0119\u0107?
about.faq.a5=Lekcj\u0119 mo\u017Cna prze\u0142o\u017Cy\u0107 lub odwo\u0142a\u0107 bezp\u0142atnie z co najmniej 24-godzinnym wyprzedzeniem. P\u00F3\u017Ane odwo\u0142ania lub nieobecno\u015Bci licz\u0105 si\u0119 jako wykorzystana lekcja. Pe\u0142ne informacje znajdziesz w naszej Polityce zwrot\u00F3w.


# ===== REVIEWS (Home page slider) =====
reviews.review1.text=To wielkie szcz\u0119\u015Bcie uczy\u0107 si\u0119 od osoby, kt\u00F3ra nie tylko podchodzi do swojej pracy z pasj\u0105, ale tak\u017Ce potrafi zainspirowa\u0107 swoich uczni\u00F3w. Ogromne podzi\u0119kowania dla utalentowanej inspiratorki i motywatorki Oleny K. za odkrycie, \u017Ce nauka angielskiego mo\u017Ce by\u0107 tak interesuj\u0105ca \uD83D\uDD25
reviews.review1.author=Viktoriia
reviews.review2.text=Lekcje z Olen\u0105 to czysta przyjemno\u015B\u0107! \u0141\u0105czy nauczanie podstaw j\u0119zyka z zabawnymi elementami, takimi jak s\u0142uchanie piosenek i t\u0142umaczenie tekst\u00F3w, co pozwala nieco pozna\u0107 kultur\u0119. Ka\u017Cda lekcja z ni\u0105 mija w mgnieniu oka!
reviews.review2.author=Marta
reviews.review3.text=Ucz\u0119 si\u0119 w szkole LC Albion od prawie roku. Jako zapracowany muzyk tradycyjna nauka w klasie nigdy mi nie odpowiada\u0142a, ale spotkanie z Olen\u0105 to zmieni\u0142o. Dzi\u0119ki jej profesjonalnemu podej\u015Bciu, elastycznemu harmonogramowi zaj\u0119\u0107 online i umiej\u0119tno\u015Bci sprawiania, \u017Ce nauka jest naprawd\u0119 wci\u0105gaj\u0105ca, jestem zachwycony moimi post\u0119pami. Gor\u0105co polecam t\u0119 szko\u0142\u0119 ka\u017Cdemu zmotywowanemu uczniowi!
reviews.review3.author=Daniil
reviews.review4.text=Chcia\u0142bym podzi\u0119kowa\u0107! Jeszcze raz za te 4 miesi\u0105ce sp\u0119dzone w waszej szkole j\u0119zyka angielskiego. Przypomnia\u0142em sobie wiele z czas\u00F3w szko\u0142y i studi\u00F3w, ale co najwa\u017Cniejsze, nabra\u0142em pewno\u015Bci, \u017Ce potrafi\u0119 m\u00F3wi\u0107 po angielsku, \u017Ce nie jest straszne wyja\u015Bnianie obcokrajowcowi, czego chc\u0119, nawet \u0142aman\u0105 angielszczyzn\u0105)) Byli\u015Bmy w Egipcie, w tamtejszym hotelu prawie nie ma os\u00F3b m\u00F3wi\u0105cych po rosyjsku. Ca\u0142y personel m\u00F3wi po angielsku. Uda\u0142o mi si\u0119!
reviews.review4.author=Maria
reviews.review5.text=Nauka angielskiego by\u0142a dla mnie trudna, bo nauczyciele zawsze wywo\u0142ywali u mnie niepok\u00F3j. Od pierwszej lekcji czu\u0142am si\u0119 swobodnie z Len\u0105. Jej lekcje s\u0105 elastyczne, praktyczne i skupiaj\u0105 si\u0119 na prawdziwych rozmowach. Delikatnie poprawia b\u0142\u0119dy, co pomog\u0142o mi przezwyci\u0119\u017Cy\u0107 strach i m\u00F3wi\u0107 pewniej. Zaj\u0119cia online s\u0105 wygodne, a lekcje grupowe pozwalaj\u0105 pozna\u0107 ludzi z r\u00F3\u017Cnych kraj\u00F3w. Serdecznie polecam Len\u0119 \u2013 to w\u0142a\u015Bnie dzi\u0119ki niej w ko\u0144cu zacz\u0119\u0142am m\u00F3wi\u0107 po angielsku!
reviews.review5.author=Maryna
reviews.review6.text=Lena, chcia\u0142am Ci bardzo podzi\u0119kowa\u0107 za lekcje. Naprawd\u0119 widz\u0119 post\u0119py, mimo \u017Ce nie uczymy si\u0119 jeszcze zbyt d\u0142ugo. Dosz\u0142am do wniosku, \u017Ce naprawd\u0119 trzeba uczy\u0107 si\u0119 codziennie, przynajmniej przez 30 minut. W przeciwnym razie nie nauczysz si\u0119 j\u0119zyka.
reviews.review6.author=Kateryna

