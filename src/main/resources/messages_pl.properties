courses.methodology.speakingClubs.label=Kluby konwersacyjne
courses.methodology.speakingClubs.title=Kto prowadzi nasze kluby konwersacyjne?
courses.methodology.speakingClubs.text=Nasze kluby konwersacyjne prowadz\u0105 do\u015Bwiadczeni profesjonali\u015Bci i native speakerzy, skupieni na prawdziwej komunikacji, pewno\u015Bci siebie i praktycznym angielskim na dzisiejsze czasy.

courses.methodology.speaker.cory.name=Cory
courses.methodology.speaker.cory.bio1=Cory jest rodowitym Amerykaninem z Teksasu, m\u00F3wi\u0105cym z ciep\u0142ym po\u0142udniowym akcentem. Uwa\u017Ca, \u017Ce uczniowie powinni zaczyna\u0107 m\u00F3wi\u0107 od razu, nawet pope\u0142niaj\u0105c b\u0142\u0119dy, poniewa\u017C pewno\u015B\u0107 siebie i bieg\u0142o\u015B\u0107 rozwijaj\u0105 si\u0119 naturalnie dzi\u0119ki prawdziwym rozmowom.
courses.methodology.speaker.cory.bio2=Inspirowany m\u0105dro\u015Bci\u0105 swojej babci, Cory tworzy wspieraj\u0105c\u0105 i motywuj\u0105c\u0105 atmosfer\u0119 na ka\u017Cdym klubie konwersacyjnym.

courses.methodology.speaker.marta.name=Marta
courses.methodology.speaker.marta.bio1=Marta jest do\u015Bwiadczon\u0105 specjalistk\u0105 HR, kt\u00F3ra pracowa\u0142a w Google w Dublinie na stanowisku wy\u017Cszego szczebla i mieszka\u0142a w Irlandii ponad 10 lat.
courses.methodology.speaker.marta.bio2=Specjalizuje si\u0119 w angielskim biznesowym, przygotowaniu do rozm\u00F3w kwalifikacyjnych i komunikacji zawodowej, a tak\u017Ce prowadzi spotkania na \u017Cywo w Warszawie.

courses.methodology.learningSystem.label=System nauki
courses.methodology.learningSystem.title=Nasza metodyka nauczania
courses.methodology.text1=\u0141\u0105czymy uporz\u0105dkowane podej\u015Bcie akademickie z nowoczesnymi narz\u0119dziami do nauki, interaktywnymi \u0107wiczeniami i praktyk\u0105 prawdziwej komunikacji. Uczniowie s\u0105 starannie przydzielani do grup na podstawie swoich cel\u00F3w i tempa nauki.
courses.methodology.text2=Ju\u017C od pierwszej lekcji uczniowie zaczynaj\u0105 m\u00F3wi\u0107 i \u0107wiczy\u0107 przydatne struktury j\u0119zykowe. Wszyscy uczniowie otrzymuj\u0105 te\u017C bezp\u0142atny dost\u0119p do klub\u00F3w konwersacyjnych z native speakerami.

