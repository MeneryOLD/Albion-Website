legal.refund.content=<h2>1. \u0417\u0430\u0433\u0430\u043B\u044C\u043D\u0430 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044F</h2><p>\u041C\u0438 \u0445\u043E\u0447\u0435\u043C\u043E, \u0449\u043E\u0431 \u0432\u0438 \u0437\u0430\u043B\u0438\u0448\u0438\u043B\u0438\u0441\u044F \u0437\u0430\u0434\u043E\u0432\u043E\u043B\u0435\u043D\u0456 \u043D\u0430\u0432\u0447\u0430\u043D\u043D\u044F\u043C \u0432 Albion EDU. \u0426\u044F \u041F\u043E\u043B\u0456\u0442\u0438\u043A\u0430 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432 \u043F\u043E\u044F\u0441\u043D\u044E\u0454 \u0443\u043C\u043E\u0432\u0438, \u0437\u0430 \u044F\u043A\u0438\u0445 \u043C\u043E\u0436\u0443\u0442\u044C \u0431\u0443\u0442\u0438 \u0437\u0434\u0456\u0439\u0441\u043D\u0435\u043D\u0456 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u0437\u0430 \u043A\u0443\u0440\u0441\u0438, \u0437\u0430\u043D\u044F\u0442\u0442\u044F \u0442\u0430 \u043F\u043E\u043A\u0443\u043F\u043A\u0438 \u0432 \u043C\u0430\u0433\u0430\u0437\u0438\u043D\u0456.</p><h2>2. \u0406\u043D\u0434\u0438\u0432\u0456\u0434\u0443\u0430\u043B\u044C\u043D\u0456 \u0437\u0430\u043D\u044F\u0442\u0442\u044F</h2><ul><li>\u042F\u043A\u0449\u043E \u0432\u0438 \u0441\u043A\u0430\u0441\u0443\u0454\u0442\u0435 \u0437\u0430\u043F\u043B\u0430\u043D\u043E\u0432\u0430\u043D\u0435 \u0456\u043D\u0434\u0438\u0432\u0456\u0434\u0443\u0430\u043B\u044C\u043D\u0435 \u0437\u0430\u043D\u044F\u0442\u0442\u044F \u0449\u043E\u043D\u0430\u0439\u043C\u0435\u043D\u0448\u0435 \u0437\u0430 24 \u0433\u043E\u0434\u0438\u043D\u0438, \u0432\u0438 \u043C\u043E\u0436\u0435\u0442\u0435 \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0442\u0438 \u0439\u043E\u0433\u043E \u0431\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u043E.</li><li>\u0421\u043A\u0430\u0441\u0443\u0432\u0430\u043D\u043D\u044F \u043C\u0435\u043D\u0448 \u043D\u0456\u0436 \u0437\u0430 24 \u0433\u043E\u0434\u0438\u043D\u0438 \u0434\u043E \u0437\u0430\u043D\u044F\u0442\u0442\u044F \u043C\u043E\u0436\u0443\u0442\u044C \u043D\u0435 \u043F\u0456\u0434\u043B\u044F\u0433\u0430\u0442\u0438 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044E \u043A\u043E\u0448\u0442\u0456\u0432 \u0447\u0438 \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0435\u043D\u043D\u044E.</li><li>\u042F\u043A\u0449\u043E \u0437\u0430\u043D\u044F\u0442\u0442\u044F \u0441\u043A\u0430\u0441\u043E\u0432\u0443\u0454 \u0432\u0438\u043A\u043B\u0430\u0434\u0430\u0447, \u0432\u0430\u043C \u0431\u0443\u0434\u0435 \u0437\u0430\u043F\u0440\u043E\u043F\u043E\u043D\u043E\u0432\u0430\u043D\u043E \u0431\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u0435 \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0435\u043D\u043D\u044F \u0430\u0431\u043E \u043F\u043E\u0432\u043D\u0435 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432 \u0437\u0430 \u0446\u0435 \u0437\u0430\u043D\u044F\u0442\u0442\u044F.</li></ul><h2>3. \u0413\u0440\u0443\u043F\u043E\u0432\u0456 \u043A\u0443\u0440\u0441\u0438</h2><ul><li>\u042F\u043A\u0449\u043E \u0432\u0438 \u0441\u043A\u0430\u0441\u0443\u0454\u0442\u0435 \u0437\u0430\u043F\u0438\u0441 \u0434\u043E \u043F\u043E\u0447\u0430\u0442\u043A\u0443 \u043A\u0443\u0440\u0441\u0443, \u0432\u0430\u043C \u043D\u0430\u043B\u0435\u0436\u0438\u0442\u044C \u043F\u043E\u0432\u043D\u0435 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432.</li><li>\u042F\u043A\u0449\u043E \u0432\u0438 \u0441\u043A\u0430\u0441\u0443\u0454\u0442\u0435 \u0437\u0430\u043F\u0438\u0441 \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C \u043F\u0435\u0440\u0448\u043E\u0433\u043E \u0442\u0438\u0436\u043D\u044F \u043F\u0456\u0441\u043B\u044F \u043F\u043E\u0447\u0430\u0442\u043A\u0443 \u043A\u0443\u0440\u0441\u0443, \u043C\u043E\u0436\u0435 \u0431\u0443\u0442\u0438 \u0437\u0434\u0456\u0439\u0441\u043D\u0435\u043D\u043E \u0447\u0430\u0441\u0442\u043A\u043E\u0432\u0435 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432 \u0437\u0430 \u0432\u0438\u0440\u0430\u0445\u0443\u0432\u0430\u043D\u043D\u044F\u043C \u0432\u0430\u0440\u0442\u043E\u0441\u0442\u0456 \u0432\u0436\u0435 \u0432\u0456\u0434\u0432\u0456\u0434\u0430\u043D\u0438\u0445 \u0437\u0430\u043D\u044F\u0442\u044C.</li><li>\u041F\u0456\u0441\u043B\u044F \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F \u043F\u0435\u0440\u0448\u043E\u0433\u043E \u0442\u0438\u0436\u043D\u044F \u0433\u0440\u0443\u043F\u043E\u0432\u043E\u0433\u043E \u043A\u0443\u0440\u0441\u0443 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432 \u043D\u0435 \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u0454\u0442\u044C\u0441\u044F.</li></ul><h2>4. \u0426\u0438\u0444\u0440\u043E\u0432\u0456 \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u0438 \u0442\u0430 \u043F\u043E\u043A\u0443\u043F\u043A\u0438 \u0432 \u043C\u0430\u0433\u0430\u0437\u0438\u043D\u0456</h2><p>\u0427\u0435\u0440\u0435\u0437 \u0441\u043F\u0435\u0446\u0438\u0444\u0456\u043A\u0443 \u0446\u0438\u0444\u0440\u043E\u0432\u043E\u0433\u043E \u043A\u043E\u043D\u0442\u0435\u043D\u0442\u0443 \u043F\u043E\u043A\u0443\u043F\u043A\u0438 \u0437\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0443\u0432\u0430\u043D\u0438\u0445 \u043C\u0430\u0442\u0435\u0440\u0456\u0430\u043B\u0456\u0432, \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0438\u0445 \u043A\u043D\u0438\u0433 \u0447\u0438 \u0446\u0438\u0444\u0440\u043E\u0432\u0438\u0445 \u043A\u0443\u0440\u0441\u0456\u0432, \u044F\u043A \u043F\u0440\u0430\u0432\u0438\u043B\u043E, \u043D\u0435 \u043F\u0456\u0434\u043B\u044F\u0433\u0430\u044E\u0442\u044C \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044E \u043F\u0456\u0441\u043B\u044F \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u0434\u043E\u0441\u0442\u0443\u043F\u0443, \u043E\u043A\u0440\u0456\u043C \u0432\u0438\u043F\u0430\u0434\u043A\u0456\u0432, \u043A\u043E\u043B\u0438 \u043F\u0440\u043E\u0434\u0443\u043A\u0442 \u0454 \u0434\u0435\u0444\u0435\u043A\u0442\u043D\u0438\u043C \u0430\u0431\u043E \u0441\u0443\u0442\u0442\u0454\u0432\u043E \u043D\u0435 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0430\u0454 \u043E\u043F\u0438\u0441\u0443.</p><h2>5. \u042F\u043A \u043F\u043E\u0434\u0430\u0442\u0438 \u0437\u0430\u043F\u0438\u0442 \u043D\u0430 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432</h2><p>\u0429\u043E\u0431 \u043F\u043E\u0434\u0430\u0442\u0438 \u0437\u0430\u043F\u0438\u0442 \u043D\u0430 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432, \u0437\u0432\u2019\u044F\u0436\u0456\u0442\u044C\u0441\u044F \u0437 \u043D\u0430\u043C\u0438 \u0437\u0430 \u0430\u0434\u0440\u0435\u0441\u043E\u044E <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a>, \u0432\u043A\u0430\u0437\u0430\u0432\u0448\u0438 \u0434\u0435\u0442\u0430\u043B\u0456 \u0437\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u0442\u0430 \u043F\u0440\u0438\u0447\u0438\u043D\u0443 \u0437\u0430\u043F\u0438\u0442\u0443. \u041C\u0438 \u043F\u0440\u0430\u0433\u043D\u0435\u043C\u043E \u0440\u043E\u0437\u0433\u043B\u044F\u0434\u0430\u0442\u0438 \u0432\u0441\u0456 \u0437\u0430\u043F\u0438\u0442\u0438 \u043D\u0430 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432 \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C 5 \u0440\u043E\u0431\u043E\u0447\u0438\u0445 \u0434\u043D\u0456\u0432.</p><h2>6. \u041E\u0431\u0440\u043E\u0431\u043A\u0430 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432</h2><p>\u0421\u0445\u0432\u0430\u043B\u0435\u043D\u0456 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432 \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u044E\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u043E\u0447\u0430\u0442\u043A\u043E\u0432\u0438\u0439 \u0441\u043F\u043E\u0441\u0456\u0431 \u043E\u043F\u043B\u0430\u0442\u0438 \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C 5\u201310 \u0440\u043E\u0431\u043E\u0447\u0438\u0445 \u0434\u043D\u0456\u0432, \u0437\u0430\u043B\u0435\u0436\u043D\u043E \u0432\u0456\u0434 \u0432\u0430\u0448\u043E\u0433\u043E \u0431\u0430\u043D\u043A\u0443 \u0447\u0438 \u043F\u043B\u0430\u0442\u0456\u0436\u043D\u043E\u0433\u043E \u043F\u0440\u043E\u0432\u0430\u0439\u0434\u0435\u0440\u0430.</p><h2>7. \u0412\u0438\u043D\u044F\u0442\u043A\u0438</h2><p>\u041C\u0438 \u0437\u0430\u043B\u0438\u0448\u0430\u0454\u043C\u043E \u0437\u0430 \u0441\u043E\u0431\u043E\u044E \u043F\u0440\u0430\u0432\u043E \u0432\u0456\u0434\u043C\u043E\u0432\u0438\u0442\u0438 \u0443 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u0456 \u043A\u043E\u0448\u0442\u0456\u0432 \u0443 \u0440\u0430\u0437\u0456 \u0432\u0438\u044F\u0432\u043B\u0435\u043D\u043D\u044F \u0437\u043B\u043E\u0432\u0436\u0438\u0432\u0430\u043D\u043D\u044F \u0446\u0456\u0454\u044E \u043F\u043E\u043B\u0456\u0442\u0438\u043A\u043E\u044E, \u0448\u0430\u0445\u0440\u0430\u0439\u0441\u0442\u0432\u0430 \u0447\u0438 \u043F\u043E\u0440\u0443\u0448\u0435\u043D\u043D\u044F \u043D\u0430\u0448\u0438\u0445 \u0423\u043C\u043E\u0432 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433.</p><h2>8. \u0417\u043C\u0456\u043D\u0438 \u0434\u043E \u0446\u0456\u0454\u0457 \u043F\u043E\u043B\u0456\u0442\u0438\u043A\u0438</h2><p>\u041C\u0438 \u043C\u043E\u0436\u0435\u043C\u043E \u043F\u0435\u0440\u0456\u043E\u0434\u0438\u0447\u043D\u043E \u043E\u043D\u043E\u0432\u043B\u044E\u0432\u0430\u0442\u0438 \u0446\u044E \u041F\u043E\u043B\u0456\u0442\u0438\u043A\u0443 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432. \u0423\u0441\u0456 \u0437\u043C\u0456\u043D\u0438 \u0431\u0443\u0434\u0443\u0442\u044C \u043E\u043F\u0443\u0431\u043B\u0456\u043A\u043E\u0432\u0430\u043D\u0456 \u043D\u0430 \u0446\u0456\u0439 \u0441\u0442\u043E\u0440\u0456\u043D\u0446\u0456 \u0456\u0437 \u0437\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u043D\u044F\u043C \u0434\u0430\u0442\u0438 \u043E\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F.</p><h2>9. \u041A\u043E\u043D\u0442\u0430\u043A\u0442\u0438</h2><p>\u042F\u043A\u0449\u043E \u0443 \u0432\u0430\u0441 \u0454 \u0437\u0430\u043F\u0438\u0442\u0430\u043D\u043D\u044F \u0449\u043E\u0434\u043E \u0446\u0456\u0454\u0457 \u041F\u043E\u043B\u0456\u0442\u0438\u043A\u0438 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432, \u0437\u0432\u0435\u0440\u0442\u0430\u0439\u0442\u0435\u0441\u044F \u0434\u043E \u043D\u0430\u0441 \u0437\u0430 \u0430\u0434\u0440\u0435\u0441\u043E\u044E <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u0430\u0431\u043E \u0437\u0430 \u043D\u043E\u043C\u0435\u0440\u043E\u043C <a href="tel:+48574065884">+48 574 065 884</a>.</p>
