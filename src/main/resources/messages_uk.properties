legal.privacy.content=<h2>\u0412\u0441\u0442\u0443\u043F</h2><p>\u041C\u0438 \u043F\u0456\u043A\u043B\u0443\u0454\u043C\u043E\u0441\u044F \u043F\u0440\u043E \u0432\u0430\u0448\u0443 \u043F\u0440\u0438\u0432\u0430\u0442\u043D\u0456\u0441\u0442\u044C. \u041C\u0438 \u0437\u0431\u0438\u0440\u0430\u0454\u043C\u043E \u0442\u0430 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0454\u043C\u043E \u0432\u0430\u0448\u0456 \u0434\u0430\u043D\u0456 \u043B\u0438\u0448\u0435 \u0442\u043E\u0434\u0456, \u043A\u043E\u043B\u0438 \u0446\u0435 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u043E \u0434\u043B\u044F \u043D\u0430\u043B\u0435\u0436\u043D\u043E\u0433\u043E \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433\u0438. \u0412\u0438 \u043C\u043E\u0436\u0435\u0442\u0435 \u0437\u0432\u2019\u044F\u0437\u0430\u0442\u0438\u0441\u044F \u0437 \u043D\u0430\u043C\u0438 \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u044E \u043F\u043E\u0448\u0442\u043E\u044E: <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u0430\u0431\u043E \u0437\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u043E\u043C: <a href="tel:+48574065884">+48 574 065 884</a>.</p><p>\u0412\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E \u0434\u043E GDPR, \u043D\u0438\u0436\u0447\u0435 \u043D\u0430\u0432\u0435\u0434\u0435\u043D\u043E \u043F\u0440\u0430\u0432\u0438\u043B\u0430 \u043E\u0431\u0440\u043E\u0431\u043A\u0438 \u0434\u0430\u043D\u0438\u0445, \u044F\u043A\u0456 \u0437\u0430\u0441\u0442\u043E\u0441\u043E\u0432\u0443\u0454 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440.</p><h2>I. \u0425\u0442\u043E \u0454 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u043E\u043C \u0434\u0430\u043D\u0438\u0445?</h2><p>\u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u043E\u043C \u0434\u0430\u043D\u0438\u0445 \u0454 Lc Albion Olena Kiriushkina (NIP: 1251785312, REGON: 541427716), \u0437\u0430\u0440\u0435\u0454\u0441\u0442\u0440\u043E\u0432\u0430\u043D\u0430 \u0437\u0430 \u0430\u0434\u0440\u0435\u0441\u043E\u044E: \u0432\u0443\u043B. Kruczej, \u0412\u0430\u0440\u0448\u0430\u0432\u0430, 00-526, \u041F\u043E\u043B\u044C\u0449\u0430.</p><h2>II. \u0417 \u044F\u043A\u043E\u044E \u043C\u0435\u0442\u043E\u044E \u043C\u0438 \u0437\u0431\u0438\u0440\u0430\u0454\u043C\u043E \u0432\u0430\u0448\u0456 \u0434\u0430\u043D\u0456? \u042F\u043A \u0434\u043E\u0432\u0433\u043E \u043C\u0438 \u0457\u0445 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0454\u043C\u043E?</h2><p>\u041C\u0438 \u043C\u043E\u0436\u0435\u043C\u043E \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438 \u0432\u0430\u0448\u0456 \u0434\u0430\u043D\u0456 \u0437 \u0442\u0430\u043A\u043E\u044E \u043C\u0435\u0442\u043E\u044E:</p><h3>\u041A\u043E\u043C\u0443\u043D\u0456\u043A\u0430\u0446\u0456\u044F \u0437 \u0432\u0430\u043C\u0438</h3><p>\u0412\u043A\u043B\u044E\u0447\u043D\u043E \u0437 \u043D\u0430\u0434\u0430\u043D\u043D\u044F\u043C \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0435\u0439 \u043D\u0430 \u0437\u0430\u043F\u0438\u0442\u0430\u043D\u043D\u044F, \u043D\u0430\u0434\u0456\u0441\u043B\u0430\u043D\u0456 \u0447\u0435\u0440\u0435\u0437 \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043D\u0443 \u0444\u043E\u0440\u043C\u0443, \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0443 \u043F\u043E\u0448\u0442\u0443, \u0443 \u0440\u0430\u043C\u043A\u0430\u0445 \u043E\u043D\u043B\u0430\u0439\u043D-\u0437\u0443\u0441\u0442\u0440\u0456\u0447\u0435\u0439 \u0442\u043E\u0449\u043E. \u0414\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 \u0443 \u043A\u043E\u043C\u0443\u043D\u0456\u043A\u0430\u0446\u0456\u0457 \u0437 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0430\u043C\u0438 \u0421\u0430\u0439\u0442\u0443 (\u0441\u0442. 6(1)(f) GDPR). \u0412\u0430\u0448\u0456 \u0434\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043D\u0435 \u0434\u043E\u0432\u0448\u0435, \u043D\u0456\u0436 \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0432\u0430\u043C\u0438 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F \u0430\u0431\u043E \u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438. \u041D\u0430\u0434\u0430\u043D\u043D\u044F \u0446\u0438\u0445 \u0434\u0430\u043D\u0438\u0445 \u0454 \u0434\u043E\u0431\u0440\u043E\u0432\u0456\u043B\u044C\u043D\u0438\u043C, \u0430\u043B\u0435 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0438\u043C \u0434\u043B\u044F \u043A\u043E\u043C\u0443\u043D\u0456\u043A\u0430\u0446\u0456\u0457 \u0437 \u0432\u0430\u043C\u0438. \u0414\u0430\u043D\u0456 \u0442\u0430\u043A\u043E\u0436 \u043C\u043E\u0436\u0443\u0442\u044C \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u0441\u044F \u0434\u043B\u044F \u0432\u043D\u0443\u0442\u0440\u0456\u0448\u043D\u044C\u043E\u0457 \u0430\u0440\u0445\u0456\u0432\u0430\u0446\u0456\u0457 \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0441\u0442. 6(1)(f) GDPR) \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F \u0430\u0431\u043E \u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438.</p><h3>\u0423\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0442\u0430 \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443</h3><p>\u0423\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u0442\u0430 \u0439\u043E\u0433\u043E \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F (\u043E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u043D\u044F \u0437\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u043D\u044F); \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F, \u0437\u0430\u0445\u0438\u0441\u0442 \u0456 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0456\u0439; \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u043F\u0440\u0430\u0432\u043E\u0432\u0438\u0445 \u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043A\u0456\u0432, \u043F\u043E\u043A\u043B\u0430\u0434\u0435\u043D\u0438\u0445 \u043D\u0430 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0437\u043E\u043A\u0440\u0435\u043C\u0430, \u043F\u043E\u0434\u0430\u0442\u043A\u043E\u0432\u0438\u0445 \u0442\u0430 \u0430\u0440\u0445\u0456\u0432\u043D\u0438\u0445).</p><p>\u0414\u0430\u043D\u0456, \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0456 \u0434\u043B\u044F \u0443\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0442\u0430 \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443, \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C \u0441\u0442\u0440\u043E\u043A\u0443 \u0434\u0456\u0457 \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443, \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0437\u0456 \u0441\u0442\u0440\u043E\u043A\u043E\u043C \u0440\u0435\u0430\u043B\u0456\u0437\u0430\u0446\u0456\u0457 \u043F\u0440\u0430\u0432, \u0449\u043E \u0432\u0438\u043F\u043B\u0438\u0432\u0430\u044E\u0442\u044C \u0456\u0437 \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443, \u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434 \u043F\u0440\u0430\u0432\u0430 \u043D\u0430 \u0440\u0435\u043A\u043B\u0430\u043C\u0430\u0446\u0456\u044E \u0437\u0430 \u0433\u0430\u0440\u0430\u043D\u0442\u0456\u0454\u044E (\u0441\u0442. 6(1)(b) \u0456 (f) GDPR). \u041D\u0430\u0434\u0430\u043D\u043D\u044F \u0446\u0438\u0445 \u0434\u0430\u043D\u0438\u0445 \u0454 \u0434\u043E\u0431\u0440\u043E\u0432\u0456\u043B\u044C\u043D\u0438\u043C, \u0430\u043B\u0435 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0438\u043C \u0434\u043B\u044F \u0443\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0442\u0430 \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443.</p><p>\u0414\u043E\u0434\u0430\u0442\u043A\u043E\u0432\u0456 \u0434\u0430\u043D\u0456, \u043D\u0430\u0434\u0430\u043D\u0456, \u0437\u043E\u043A\u0440\u0435\u043C\u0430, \u0434\u043B\u044F \u043F\u043E\u043A\u0440\u0430\u0449\u0435\u043D\u043D\u044F \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443, \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043D\u0435 \u0434\u043E\u0432\u0448\u0435, \u043D\u0456\u0436 \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0432\u0430\u043C\u0438 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F \u0430\u0431\u043E \u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438, \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0432 \u043E\u0431\u0441\u043B\u0443\u0433\u043E\u0432\u0443\u0432\u0430\u043D\u043D\u0456 \u043A\u043B\u0456\u0454\u043D\u0442\u0456\u0432 (\u0441\u0442. 6(1)(f) GDPR).</p><p>\u041F\u0456\u0441\u043B\u044F \u0446\u044C\u043E\u0433\u043E \u043F\u0435\u0440\u0456\u043E\u0434\u0443 \u0434\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C \u0441\u0442\u0440\u043E\u043A\u0443 \u043F\u043E\u0437\u043E\u0432\u043D\u043E\u0457 \u0434\u0430\u0432\u043D\u043E\u0441\u0442\u0456 \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 \u0434\u043B\u044F \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u0432\u0456\u0434 \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0456\u0439, \u0430 \u0442\u0430\u043A\u043E\u0436 \u0434\u043B\u044F \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u0442\u0430 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0456\u0439 (\u0441\u0442. 6(1)(f) GDPR).</p><p>\u0423 \u0432\u0438\u043F\u0430\u0434\u043A\u0430\u0445, \u043A\u043E\u043B\u0438 \u0434\u0430\u043D\u0456 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0456 \u0434\u043B\u044F \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u043F\u0440\u0430\u0432\u043E\u0432\u0438\u0445 \u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043A\u0456\u0432 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434, \u0432\u0438\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u043D\u044F \u0442\u0430 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u043D\u043D\u044F \u0440\u0430\u0445\u0443\u043D\u043A\u0456\u0432-\u0444\u0430\u043A\u0442\u0443\u0440), \u0434\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u0437 \u0446\u0456\u0454\u044E \u043C\u0435\u0442\u043E\u044E \u043D\u0435 \u0434\u043E\u0432\u0448\u0435 6 \u0440\u043E\u043A\u0456\u0432 (\u0430\u0440\u0445\u0456\u0432\u043D\u0456 \u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043A\u0438 \u0449\u043E\u0434\u043E \u0431\u0443\u0445\u0433\u0430\u043B\u0442\u0435\u0440\u0441\u044C\u043A\u0438\u0445 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0456\u0432), \u044F\u043A\u0449\u043E \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0432\u0441\u0442\u0432\u043E \u043D\u0435 \u0432\u0438\u043C\u0430\u0433\u0430\u0454 \u0434\u043E\u0432\u0448\u043E\u0433\u043E \u0441\u0442\u0440\u043E\u043A\u0443 (\u0441\u0442. 6(1)(c) GDPR).</p><p>\u0414\u0430\u043D\u0456 \u0442\u0430\u043A\u043E\u0436 \u043C\u043E\u0436\u0443\u0442\u044C \u0430\u0440\u0445\u0456\u0432\u0443\u0432\u0430\u0442\u0438\u0441\u044F \u0434\u043B\u044F \u0432\u043D\u0443\u0442\u0440\u0456\u0448\u043D\u0456\u0445 \u0442\u0430 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u0447\u043D\u0438\u0445 \u0446\u0456\u043B\u0435\u0439 \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0432\u0430\u043C\u0438 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F \u0430\u0431\u043E \u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438 \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0441\u0442. 6(1)(f) GDPR).</p><h3>\u041C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u0430/\u043A\u043E\u043C\u0435\u0440\u0446\u0456\u0439\u043D\u0430 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044F</h3><p>\u041D\u0430\u0434\u0430\u043D\u043D\u044F \u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0457/\u043A\u043E\u043C\u0435\u0440\u0446\u0456\u0439\u043D\u043E\u0457 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457 (\u0434\u0430\u043B\u0456 \u2014 \u041C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u0430 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044F), \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0437 \u0440\u043E\u0437\u0441\u0438\u043B\u043A\u043E\u044E \u043D\u043E\u0432\u0438\u043D \u0442\u0430 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457 \u043F\u0440\u043E \u043F\u043E\u0441\u043B\u0443\u0433\u0438, \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u0438, \u0430\u043A\u0446\u0456\u0457, \u0431\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u0438\u0439 \u043A\u043E\u043D\u0442\u0435\u043D\u0442 \u0437\u0430 \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u043E\u044E \u0456\u043D\u0448\u0438\u0445 \u0456\u043D\u0441\u0442\u0440\u0443\u043C\u0435\u043D\u0442\u0456\u0432 (\u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434, SMS, \u0442\u0435\u043B\u0435\u0444\u043E\u043D).</p><p>\u0414\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 \u0443 \u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u0443 \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u0456\u0432 \u0442\u0430 \u043F\u043E\u0441\u043B\u0443\u0433 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0441\u0442. 6(1)(f) GDPR). \u0412\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E \u0434\u043E \u0441\u0442\u0430\u0442\u0442\u0456 398 \u0417\u0430\u043A\u043E\u043D\u0443 \u043F\u0440\u043E \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0456 \u043A\u043E\u043C\u0443\u043D\u0456\u043A\u0430\u0446\u0456\u0457, \u0434\u043B\u044F \u043F\u0456\u0434\u0442\u0440\u0438\u043C\u043A\u0438 \u043A\u043E\u043C\u0435\u0440\u0446\u0456\u0439\u043D\u043E\u0457/\u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0457 \u043A\u043E\u043C\u0443\u043D\u0456\u043A\u0430\u0446\u0456\u0457 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0430 \u0432\u0430\u0448\u0430 \u0437\u0433\u043E\u0434\u0430. \u0412\u0438 \u043C\u043E\u0436\u0435\u0442\u0435 \u0432\u0456\u0434\u043A\u043B\u0438\u043A\u0430\u0442\u0438 \u0457\u0457 \u0432 \u0431\u0443\u0434\u044C-\u044F\u043A\u0438\u0439 \u043C\u043E\u043C\u0435\u043D\u0442:</p><ul><li>\u043D\u0430\u0442\u0438\u0441\u043D\u0443\u0432\u0448\u0438 \u043D\u0430 \u043F\u043E\u0441\u0438\u043B\u0430\u043D\u043D\u044F \u0443 \u043F\u0456\u0434\u043F\u0438\u0441\u0456 \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u0433\u043E \u043B\u0438\u0441\u0442\u0430 \u0430\u0431\u043E \u043D\u0430\u043F\u0438\u0441\u0430\u0432\u0448\u0438 \u043D\u0430\u043C \u043D\u0430 \u0430\u0434\u0440\u0435\u0441\u0443 <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u2014 \u0443 \u0440\u0430\u0437\u0456 \u0440\u043E\u0437\u0441\u0438\u043B\u043A\u0438 \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u044E \u043F\u043E\u0448\u0442\u043E\u044E,</li><li>\u0437\u0432\u0435\u0440\u043D\u0443\u0432\u0448\u0438\u0441\u044C \u0431\u0435\u0437\u043F\u043E\u0441\u0435\u0440\u0435\u0434\u043D\u044C\u043E \u0437\u0430 \u043D\u043E\u043C\u0435\u0440\u043E\u043C <a href="tel:+48574065884">+48 574 065 884</a> \u0430\u0431\u043E \u0430\u0434\u0440\u0435\u0441\u043E\u044E <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u2014 \u0443 \u0440\u0430\u0437\u0456 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u0437\u0433\u043E\u0434\u0438 \u043D\u0430 \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u043A\u043E\u043C\u0435\u0440\u0446\u0456\u0439\u043D\u043E\u0433\u043E/\u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0433\u043E \u043A\u043E\u043D\u0442\u0435\u043D\u0442\u0443 \u0447\u0435\u0440\u0435\u0437 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u043D\u0438\u0439 \u0434\u0437\u0432\u0456\u043D\u043E\u043A \u0442\u0430/\u0430\u0431\u043E SMS.</li></ul><p>\u041D\u0430\u0434\u0430\u043D\u043D\u044F \u0434\u0430\u043D\u0438\u0445 \u0454 \u0434\u043E\u0431\u0440\u043E\u0432\u0456\u043B\u044C\u043D\u0438\u043C, \u043F\u0440\u043E\u0442\u0435 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0438\u043C \u0434\u043B\u044F \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u041C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0457 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457. \u0412\u0456\u0434\u043C\u043E\u0432\u0430 \u0432\u0456\u0434 \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u041C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0457 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457 \u0443\u043D\u0435\u043C\u043E\u0436\u043B\u0438\u0432\u043B\u044E\u0454 \u0457\u0457 \u043F\u043E\u0434\u0430\u043B\u044C\u0448\u0435 \u043D\u0430\u0434\u0441\u0438\u043B\u0430\u043D\u043D\u044F \u0432\u0430\u043C.</p><p>\u0414\u0430\u043D\u0456, \u0449\u043E \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u044E\u0442\u044C\u0441\u044F \u0443 \u0437\u0432\u2019\u044F\u0437\u043A\u0443 \u0437 \u043D\u0430\u0434\u0430\u043D\u043E\u044E \u0432\u0430\u043C\u0438 \u0437\u0433\u043E\u0434\u043E\u044E \u043D\u0430 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u041C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0457 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457, \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0437 \u0434\u0430\u043D\u0438\u043C\u0438, \u0437\u0456\u0431\u0440\u0430\u043D\u0438\u043C\u0438 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u043D\u043E (\u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434, IP-\u0430\u0434\u0440\u0435\u0441\u0430), \u0442\u0430\u043A\u043E\u0436 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0441\u0442. 6(1)(f) GDPR), \u0449\u043E \u043F\u043E\u043B\u044F\u0433\u0430\u0454 \u0432 \u0430\u043D\u0430\u043B\u0456\u0437\u0456 \u043F\u043E\u0432\u0435\u0434\u0456\u043D\u043A\u0438 \u0437 \u043C\u0435\u0442\u043E\u044E \u043E\u043F\u0442\u0438\u043C\u0456\u0437\u0430\u0446\u0456\u0457 \u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0457 \u0434\u0456\u044F\u043B\u044C\u043D\u043E\u0441\u0442\u0456. \u0414\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u0437 \u0430\u043D\u0430\u043B\u0456\u0442\u0438\u0447\u043D\u043E\u044E \u0442\u0430 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u0447\u043D\u043E\u044E \u043C\u0435\u0442\u043E\u044E.</p><p>\u0412\u0430\u0448\u0456 \u0434\u0430\u043D\u0456 \u0442\u0430\u043A\u043E\u0436 \u043C\u043E\u0436\u0443\u0442\u044C \u0430\u0440\u0445\u0456\u0432\u0443\u0432\u0430\u0442\u0438\u0441\u044F \u0434\u043B\u044F \u043C\u043E\u0436\u043B\u0438\u0432\u043E\u0433\u043E \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F, \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0447\u0438 \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0456\u0439, \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0456\u0437 \u0437\u0430\u0431\u0435\u0437\u043F\u0435\u0447\u0435\u043D\u043D\u044F\u043C \u043C\u043E\u0436\u043B\u0438\u0432\u043E\u0441\u0442\u0456 \u0434\u043E\u0432\u0435\u0441\u0442\u0438, \u0449\u043E \u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u0430 \u0434\u0456\u044F\u043B\u044C\u043D\u0456\u0441\u0442\u044C \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u0432\u0430\u043B\u0430\u0441\u044F \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E \u0434\u043E \u0437\u0430\u043A\u043E\u043D\u0443, \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0441\u0442. 6(1)(f) GDPR.</p><p>\u0414\u0430\u043D\u0456, \u0449\u043E \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u044E\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0441\u0442. 6(1)(f) GDPR, \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043D\u0435 \u0434\u043E\u0432\u0448\u0435, \u043D\u0456\u0436 \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0432\u0430\u043C\u0438 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F \u0430\u0431\u043E \u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438 \u2014 \u0437\u0430\u043B\u0435\u0436\u043D\u043E \u0432\u0456\u0434 \u0442\u043E\u0433\u043E, \u0449\u043E \u043D\u0430\u0441\u0442\u0430\u043D\u0435 \u0440\u0430\u043D\u0456\u0448\u0435.</p><h3>\u0421\u043E\u0446\u0456\u0430\u043B\u044C\u043D\u0456 \u043C\u0435\u0440\u0435\u0436\u0456</h3><p>\u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0443\u0432\u0430\u043D\u043D\u044F \u0442\u0430 \u0443\u043F\u0440\u0430\u0432\u043B\u0456\u043D\u043D\u044F \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u043E\u044E \u0456 \u0433\u0440\u0443\u043F\u0430\u043C\u0438 \u043D\u0430 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0430\u0445 \u0441\u043E\u0446\u0456\u0430\u043B\u044C\u043D\u0438\u0445 \u043C\u0435\u0440\u0435\u0436 (\u0437\u043E\u043A\u0440\u0435\u043C\u0430 Meta, Instagram) \u0443 \u0440\u0430\u0437\u0456 \u043E\u0431\u0440\u043E\u0431\u043A\u0438 \u0434\u0430\u043D\u0438\u0445 \u043D\u0430 \u0446\u0438\u0445 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0430\u0445, \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0437 \u043A\u043E\u043C\u0443\u043D\u0456\u043A\u0430\u0446\u0456\u0454\u044E \u0437 \u0432\u0430\u043C\u0438 \u0442\u0430 \u0441\u043F\u0440\u044F\u043C\u0443\u0432\u0430\u043D\u043D\u044F\u043C \u0434\u043E \u0432\u0430\u0441 \u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u043E\u0433\u043E \u043A\u043E\u043D\u0442\u0435\u043D\u0442\u0443.</p><p>\u0426\u0456 \u0434\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043B\u0438\u0448\u0435 \u0442\u043E\u0434\u0456, \u043A\u043E\u043B\u0438 \u0432\u0438 \u0432\u0438\u0440\u0456\u0448\u0438\u0442\u0435 \u0432\u043F\u043E\u0434\u043E\u0431\u0430\u0442\u0438 \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0443 / \u043F\u0440\u0438\u0454\u0434\u043D\u0430\u0442\u0438\u0441\u044F \u0434\u043E \u0433\u0440\u0443\u043F\u0438 / \u043E\u0431\u0440\u0430\u0442\u0438 \u043E\u043F\u0446\u0456\u044E \u00AB\u0421\u0442\u0435\u0436\u0438\u0442\u0438\u00BB \u0430\u0431\u043E \u0432 \u0456\u043D\u0448\u0438\u0439 \u0441\u043F\u043E\u0441\u0456\u0431 \u0437\u0430\u043B\u0438\u0448\u0438\u0442\u0435 \u0441\u0432\u043E\u0457 \u0434\u0430\u043D\u0456 \u043D\u0430 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0456, \u044F\u043A\u043E\u044E \u044F \u043A\u0435\u0440\u0443\u044E, \u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434, \u0443 \u0444\u043E\u0440\u043C\u0456 \u043F\u0443\u0431\u043B\u0456\u043A\u0430\u0446\u0456\u0457 \u0430\u0431\u043E \u043A\u043E\u043C\u0435\u043D\u0442\u0430\u0440\u044F. \u0414\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C \u043F\u0435\u0440\u0456\u043E\u0434\u0443 \u0456\u0441\u043D\u0443\u0432\u0430\u043D\u043D\u044F \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0438/\u0433\u0440\u0443\u043F\u0438 \u0430\u0431\u043E \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0432\u0430\u043C\u0438 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F, \u0449\u043E \u043C\u043E\u0436\u0435 \u0432\u0456\u0434\u0431\u0443\u0442\u0438\u0441\u044F \u0448\u043B\u044F\u0445\u043E\u043C \u0441\u043A\u0430\u0441\u0443\u0432\u0430\u043D\u043D\u044F \u00AB\u041F\u043E\u0434\u043E\u0431\u0430\u0454\u0442\u044C\u0441\u044F\u00BB, \u00AB\u0421\u0442\u0435\u0436\u0438\u0442\u0438\u00BB, \u0432\u0438\u0434\u0430\u043B\u0435\u043D\u043D\u044F \u043A\u043E\u043C\u0435\u043D\u0442\u0430\u0440\u044F/\u043F\u0443\u0431\u043B\u0456\u043A\u0430\u0446\u0456\u0457 \u0430\u0431\u043E \u0432 \u0456\u043D\u0448\u0438\u0439 \u0441\u043F\u043E\u0441\u0456\u0431, \u043F\u0435\u0440\u0435\u0434\u0431\u0430\u0447\u0435\u043D\u0438\u0439 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u043E\u044E/\u0441\u0442\u043E\u0440\u0456\u043D\u043A\u043E\u044E, \u0430\u0431\u043E \u0448\u043B\u044F\u0445\u043E\u043C \u0437\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u0434\u043E \u043C\u0435\u043D\u0435.</p><p>\u041F\u0440\u0430\u0432\u0438\u043B\u0430 \u0449\u043E\u0434\u043E \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0438/\u0433\u0440\u0443\u043F \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u044E\u0454 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440, \u0442\u043E\u0434\u0456 \u044F\u043A \u043F\u0440\u0430\u0432\u0438\u043B\u0430 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0441\u043E\u0446\u0456\u0430\u043B\u044C\u043D\u043E\u044E \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u043E\u044E, \u043D\u0430 \u044F\u043A\u0456\u0439 \u0440\u043E\u0437\u043C\u0456\u0449\u0435\u043D\u0430 \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0430/\u0433\u0440\u0443\u043F\u0430, \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u044E\u0454 \u0441\u0443\u0431\u2019\u0454\u043A\u0442, \u044F\u043A\u0438\u0439 \u043A\u0435\u0440\u0443\u0454 \u0446\u0438\u043C\u0438 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0430\u043C\u0438.</p><h3>\u041A\u043E\u043C\u0435\u043D\u0442\u0430\u0440\u0456</h3><p>\u0429\u043E\u0434\u043E \u0434\u0430\u043D\u0438\u0445, \u0432\u0438\u0434\u0438\u043C\u0438\u0445 \u043D\u0430 \u043D\u0430\u0448\u043E\u043C\u0443 \u0421\u0430\u0439\u0442\u0456 \u043F\u043E\u0440\u044F\u0434 \u0456\u0437 \u0440\u043E\u0437\u043C\u0456\u0449\u0435\u043D\u0438\u043C \u043A\u043E\u043C\u0435\u043D\u0442\u0430\u0440\u0435\u043C, \u0446\u0456 \u0434\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u044E\u0442\u044C\u0441\u044F \u043D\u0430\u043C\u0438 \u0437 \u043C\u0435\u0442\u043E\u044E \u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0443\u0432\u0430\u043D\u043D\u044F \u0421\u0430\u0439\u0442\u0443 \u0442\u0430 \u0439\u043E\u0433\u043E \u043E\u0431\u0441\u043B\u0443\u0433\u043E\u0432\u0443\u0432\u0430\u043D\u043D\u044F, \u0430 \u0442\u0430\u043A\u043E\u0436 \u043A\u043E\u043C\u0443\u043D\u0456\u043A\u0430\u0446\u0456\u0457 \u0437 \u0432\u0430\u043C\u0438 \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0441\u0442. 6(1)(f)) \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C \u0447\u0430\u0441\u0443, \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u043E\u0433\u043E \u0434\u043B\u044F \u0434\u043E\u0441\u044F\u0433\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u0438\u0445 \u0446\u0456\u043B\u0435\u0439 \u0430\u0431\u043E \u0434\u043E \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F.</p><h3>\u0427\u0443\u0442\u043B\u0438\u0432\u0456 \u0434\u0430\u043D\u0456</h3><p>\u0427\u0443\u0442\u043B\u0438\u0432\u0456 \u0434\u0430\u043D\u0456 \u0437\u0431\u0438\u0440\u0430\u044E\u0442\u044C\u0441\u044F \u0437 \u043C\u0435\u0442\u043E\u044E \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u0442\u0430 \u0439\u043E\u0433\u043E \u043D\u0430\u043B\u0435\u0436\u043D\u043E\u0433\u043E \u0437\u0434\u0456\u0439\u0441\u043D\u0435\u043D\u043D\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0432\u0430\u0448\u043E\u0457 \u0441\u0432\u0456\u0434\u043E\u043C\u043E\u0457 \u0442\u0430 \u0434\u043E\u0431\u0440\u043E\u0432\u0456\u043B\u044C\u043D\u043E\u0457 \u0437\u0433\u043E\u0434\u0438 (\u0441\u0442. 9(2)(a) GDPR) \u2014 \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438 \u0430\u0431\u043E \u0432\u0456\u0434\u043A\u043B\u0438\u043A\u0430\u043D\u043D\u044F \u0437\u0433\u043E\u0434\u0438. \u041D\u0430\u0434\u0430\u043D\u043D\u044F \u0434\u0430\u043D\u0438\u0445 \u0454 \u0434\u043E\u0431\u0440\u043E\u0432\u0456\u043B\u044C\u043D\u0438\u043C, \u0430\u043B\u0435 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u0438\u043C \u0434\u043B\u044F \u043D\u0430\u043B\u0435\u0436\u043D\u043E\u0433\u043E \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 (\u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434, \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044F \u043F\u0440\u043E \u0440\u0456\u0432\u0435\u043D\u044C \u0432\u043E\u043B\u043E\u0434\u0456\u043D\u043D\u044F \u043C\u043E\u0432\u043E\u044E).</p><h2>III. \u041A\u043E\u043C\u0443 \u043C\u0438 \u043C\u043E\u0436\u0435\u043C\u043E \u043F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438 \u0432\u0430\u0448\u0456 \u0434\u0430\u043D\u0456?</h2><p>\u041C\u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u0454\u043C\u043E \u0432\u0430\u0448\u0456 \u0434\u0430\u043D\u0456 \u0456\u043D\u0448\u0438\u043C \u0441\u0443\u0431\u2019\u0454\u043A\u0442\u0430\u043C \u043B\u0438\u0448\u0435 \u0442\u043E\u0434\u0456, \u043A\u043E\u043B\u0438 \u0446\u0435 \u043D\u0435\u043E\u0431\u0445\u0456\u0434\u043D\u043E \u0434\u043B\u044F \u0434\u043E\u0441\u044F\u0433\u043D\u0435\u043D\u043D\u044F \u0446\u0456\u043B\u0435\u0439 \u043E\u0431\u0440\u043E\u0431\u043A\u0438, \u0437\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0445 \u0443 \u0440\u043E\u0437\u0434\u0456\u043B\u0456 II.</p><p>\u0417\u0430 \u043F\u043E\u0442\u0440\u0435\u0431\u0438 \u0432\u0430\u0448\u0456 \u0434\u0430\u043D\u0456 \u043C\u043E\u0436\u0443\u0442\u044C \u0431\u0443\u0442\u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u043D\u0456 \u0441\u0443\u0431\u2019\u0454\u043A\u0442\u0430\u043C, \u0437 \u044F\u043A\u0438\u043C\u0438 \u043C\u0438 \u0441\u043F\u0456\u0432\u043F\u0440\u0430\u0446\u044E\u0454\u043C\u043E \u0434\u043B\u044F \u0434\u043E\u0441\u044F\u0433\u043D\u0435\u043D\u043D\u044F \u0437\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0445 \u0446\u0456\u043B\u0435\u0439: \u0445\u043E\u0441\u0442\u0438\u043D\u0433\u043E\u0432\u0456\u0439 \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u0406\u0422-\u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457/\u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0443 \u0441\u0430\u0439\u0442\u0443, \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u0449\u043E \u043D\u0430\u0434\u0430\u0454 \u0431\u0443\u0445\u0433\u0430\u043B\u0442\u0435\u0440\u0441\u044C\u043A\u0456 \u043F\u043E\u0441\u043B\u0443\u0433\u0438, \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u0449\u043E \u043D\u0430\u0434\u0430\u0454 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043D\u0435 \u0437\u0430\u0431\u0435\u0437\u043F\u0435\u0447\u0435\u043D\u043D\u044F \u0434\u043B\u044F \u0432\u0438\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u043D\u044F \u0440\u0430\u0445\u0443\u043D\u043A\u0456\u0432, \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u0449\u043E \u043D\u0430\u0434\u0430\u0454 CRM-\u0441\u0438\u0441\u0442\u0435\u043C\u0443 \u0434\u043B\u044F \u0443\u043F\u0440\u0430\u0432\u043B\u0456\u043D\u043D\u044F \u0448\u043A\u043E\u043B\u043E\u044E, \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u0449\u043E \u043D\u0430\u0434\u0430\u0454 \u043F\u043E\u0441\u043B\u0443\u0433\u0438 \u0440\u043E\u0437\u0441\u0438\u043B\u043A\u0438, \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457 \u0445\u043C\u0430\u0440\u043D\u0438\u0445 \u043F\u043E\u0441\u043B\u0443\u0433, \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u043E\u043C\u0443 \u0430\u0433\u0435\u043D\u0442\u0441\u0442\u0432\u0443, \u0432\u0456\u0440\u0442\u0443\u0430\u043B\u044C\u043D\u043E\u043C\u0443 \u0430\u0441\u0438\u0441\u0442\u0435\u043D\u0442\u0443, \u0441\u0443\u0431\u043F\u0456\u0434\u0440\u044F\u0434\u043D\u0438\u043A\u0430\u043C, \u044E\u0440\u0438\u0441\u0442\u0430\u043C, \u043A\u0443\u0440\u2019\u0454\u0440\u0430\u043C \u0447\u0438 \u043F\u043E\u0448\u0442\u043E\u0432\u0438\u043C \u043E\u043F\u0435\u0440\u0430\u0442\u043E\u0440\u0430\u043C, \u043D\u0430\u0432\u0447\u0430\u043B\u044C\u043D\u0456\u0439 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0456, \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0456 \u043E\u0431\u0441\u043B\u0443\u0433\u043E\u0432\u0443\u0432\u0430\u043D\u043D\u044F \u043A\u043B\u0456\u0454\u043D\u0442\u0456\u0432, \u0430 \u0442\u0430\u043A\u043E\u0436 \u0456\u043D\u0448\u0438\u043C \u0441\u0443\u0431\u2019\u0454\u043A\u0442\u0430\u043C, \u044F\u043A\u0456 \u0434\u043E\u043F\u043E\u043C\u0430\u0433\u0430\u044E\u0442\u044C \u043D\u0430\u043C \u0434\u043E\u0441\u044F\u0433\u0430\u0442\u0438 \u0446\u0456\u043B\u0435\u0439 \u043E\u0431\u0440\u043E\u0431\u043A\u0438.</p><p>\u042F\u043A \u043F\u0440\u0430\u0432\u0438\u043B\u043E, \u0434\u0430\u043D\u0456 \u043D\u0435 \u043F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u0437\u0430 \u043C\u0435\u0436\u0456 \u0404\u0415\u0417. \u042F\u043A\u0449\u043E \u0436 \u0434\u0430\u043D\u0456 \u043F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F \u0437\u0430 \u043C\u0435\u0436\u0456 \u0404\u0415\u0417, \u0446\u0435 \u0432\u0456\u0434\u0431\u0443\u0432\u0430\u0442\u0438\u043C\u0435\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0432\u0430\u0448\u043E\u0457 \u0437\u0433\u043E\u0434\u0438, \u0441\u0442\u0430\u043D\u0434\u0430\u0440\u0442\u043D\u0438\u0445 \u0434\u043E\u0433\u043E\u0432\u0456\u0440\u043D\u0438\u0445 \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u044C \u0430\u0431\u043E \u0456\u043D\u0448\u0438\u0445 \u0433\u0430\u0440\u0430\u043D\u0442\u0456\u0439, \u043F\u0435\u0440\u0435\u0434\u0431\u0430\u0447\u0435\u043D\u0438\u0445 GDPR, \u043F\u0456\u0441\u043B\u044F \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F, \u0437\u043E\u043A\u0440\u0435\u043C\u0430, \u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043A\u0443 \u0449\u043E\u0434\u043E \u0456\u043D\u0444\u043E\u0440\u043C\u0443\u0432\u0430\u043D\u043D\u044F. \u0412\u0430\u0448\u0456 \u0434\u0430\u043D\u0456 \u043C\u043E\u0436\u0443\u0442\u044C \u0431\u0443\u0442\u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u043D\u0456:</p><ul><li>Google LLC, 1600 Amphitheatre Parkway, Mountain View, CA 94043, \u0421\u0428\u0410</li><li>HubSpot, 25 First Street, 2nd Floor, Cambridge, MA 02141, \u0421\u0428\u0410</li><li>Dropbox International Unlimited Company, One Park Place, Floor 5, Upper Hatch Street, \u0414\u0443\u0431\u043B\u0456\u043D</li><li>Canva, 110 Kippax St, Level 1, Surry Hills, NSW 2010, \u0410\u0432\u0441\u0442\u0440\u0430\u043B\u0456\u044F</li></ul><h2>IV. \u042F\u043A\u0456 \u043F\u0440\u0430\u0432\u0430 \u0432\u0430\u043C \u043D\u0430\u043B\u0435\u0436\u0430\u0442\u044C?</h2><p>\u0412\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E \u0434\u043E GDPR \u0432\u0430\u043C \u043D\u0430\u043B\u0435\u0436\u0438\u0442\u044C \u043F\u0440\u0430\u0432\u043E \u043D\u0430:</p><ul><li>\u0434\u043E\u0441\u0442\u0443\u043F \u0434\u043E \u0441\u0432\u043E\u0457\u0445 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445,</li><li>\u0432\u0438\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043D\u044F \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445,</li><li>\u0432\u0438\u0434\u0430\u043B\u0435\u043D\u043D\u044F \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445,</li><li>\u043E\u0431\u043C\u0435\u0436\u0435\u043D\u043D\u044F \u043E\u0431\u0440\u043E\u0431\u043A\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445,</li><li>\u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F \u043F\u0440\u043E\u0442\u0438 \u043E\u0431\u0440\u043E\u0431\u043A\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445,</li><li>\u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0435\u043D\u043D\u044F \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445,</li><li>\u0432\u0456\u0434\u043A\u043B\u0438\u043A\u0430\u043D\u043D\u044F \u0437\u0433\u043E\u0434\u0438; \u0432\u0456\u0434\u043A\u043B\u0438\u043A\u0430\u043D\u043D\u044F \u0437\u0433\u043E\u0434\u0438 \u043D\u0435 \u0432\u043F\u043B\u0438\u0432\u0430\u0454 \u043D\u0430 \u0437\u0430\u043A\u043E\u043D\u043D\u0456\u0441\u0442\u044C \u043E\u0431\u0440\u043E\u0431\u043A\u0438, \u0437\u0434\u0456\u0439\u0441\u043D\u0435\u043D\u043E\u0457 \u0434\u043E \u0457\u0457 \u0432\u0456\u0434\u043A\u043B\u0438\u043A\u0430\u043D\u043D\u044F.</li></ul><p>\u042F\u043A\u0449\u043E \u0432\u0438 \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u0435, \u0449\u043E \u0432\u0430\u0448\u0456 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0456 \u0434\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u044E\u0442\u044C\u0441\u044F \u0437 \u043F\u043E\u0440\u0443\u0448\u0435\u043D\u043D\u044F\u043C \u0447\u0438\u043D\u043D\u043E\u0433\u043E \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0432\u0441\u0442\u0432\u0430, \u0432\u0438 \u043C\u0430\u0454\u0442\u0435 \u043F\u0440\u0430\u0432\u043E \u043F\u043E\u0434\u0430\u0442\u0438 \u0441\u043A\u0430\u0440\u0433\u0443 \u0434\u043E \u0413\u043E\u043B\u043E\u0432\u0438 \u0423\u043F\u0440\u0430\u0432\u043B\u0456\u043D\u043D\u044F \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445. \u0423 \u0442\u0430\u043A\u043E\u043C\u0443 \u0432\u0438\u043F\u0430\u0434\u043A\u0443 \u043C\u0438 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0443\u0454\u043C\u043E \u0441\u043F\u0435\u0440\u0448\u0443 \u0437\u0432\u0435\u0440\u043D\u0443\u0442\u0438\u0441\u044F \u0434\u043E \u043D\u0430\u0441 \u0434\u043B\u044F \u0440\u043E\u0437\u2019\u044F\u0441\u043D\u0435\u043D\u043D\u044F \u0432\u0430\u0448\u0438\u0445 \u0441\u0443\u043C\u043D\u0456\u0432\u0456\u0432.</p><h2>V. \u0417\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0432\u0441\u0442\u0432\u043E, \u0449\u043E \u0437\u0430\u0441\u0442\u043E\u0441\u043E\u0432\u0443\u0454\u0442\u044C\u0441\u044F \u0449\u043E\u0434\u043E \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445</h2><p>\u0423 \u043F\u0438\u0442\u0430\u043D\u043D\u044F\u0445, \u043D\u0435 \u0432\u0440\u0435\u0433\u0443\u043B\u044C\u043E\u0432\u0430\u043D\u0438\u0445 \u0446\u0438\u043C \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u043E\u043C, \u0437\u0430\u0441\u0442\u043E\u0441\u043E\u0432\u0443\u044E\u0442\u044C\u0441\u044F \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u0456 \u043D\u043E\u0440\u043C\u0438 \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0432\u0441\u0442\u0432\u0430, \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0437 \u0454\u0432\u0440\u043E\u043F\u0435\u0439\u0441\u044C\u043A\u0438\u043C \u043F\u0440\u0430\u0432\u043E\u043C, \u0437\u043E\u043A\u0440\u0435\u043C\u0430 GDPR.</p><h2>VI. \u041F\u043E\u043B\u0456\u0442\u0438\u043A\u0430 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u0430\u043D\u043D\u044F \u0444\u0430\u0439\u043B\u0456\u0432 cookie</h2><p>\u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0456\u0457 \u0434\u043B\u044F \u0432\u0456\u0434\u0441\u0442\u0435\u0436\u0435\u043D\u043D\u044F \u0434\u0456\u0439, \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u0432\u0430\u043D\u0438\u0445 \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0435\u043C \u043D\u0430 \u0421\u0430\u0439\u0442\u0456:</p><ul><li>\u043F\u0456\u043A\u0441\u0435\u043B\u044C \u043A\u043E\u043D\u0432\u0435\u0440\u0441\u0456\u0457 Facebook (Meta) \u2014 \u0434\u043B\u044F \u0443\u043F\u0440\u0430\u0432\u043B\u0456\u043D\u043D\u044F \u0440\u0435\u043A\u043B\u0430\u043C\u043E\u044E \u043D\u0430 Meta \u0442\u0430 \u043F\u0440\u043E\u0432\u0435\u0434\u0435\u043D\u043D\u044F \u0440\u0435\u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u043E\u0432\u0438\u0445 \u0437\u0430\u0445\u043E\u0434\u0456\u0432;</li><li>\u043A\u043E\u0434 Google Analytics \u2014 \u0434\u043B\u044F \u0430\u043D\u0430\u043B\u0456\u0437\u0443 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0438 \u0421\u0430\u0439\u0442\u0443;</li><li>Google LLC;</li><li>Vimeo Inc.;</li><li>TikTok FTechnology Limited.</li></ul><p>Google Analytics \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454 \u0432\u043B\u0430\u0441\u043D\u0456 \u0444\u0430\u0439\u043B\u0438 cookie \u0434\u043B\u044F \u0430\u043D\u0430\u043B\u0456\u0437\u0443 \u0434\u0456\u0439 \u0442\u0430 \u043F\u043E\u0432\u0435\u0434\u0456\u043D\u043A\u0438 \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0456\u0432 \u0421\u0430\u0439\u0442\u0443. \u0426\u0456 \u0444\u0430\u0439\u043B\u0438 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u044E\u0442\u044C \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044E, \u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434, \u0437 \u044F\u043A\u043E\u0457 \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0438 \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447 \u043F\u043E\u0442\u0440\u0430\u043F\u0438\u0432 \u043D\u0430 \u043F\u043E\u0442\u043E\u0447\u043D\u0443 \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0443. \u0412\u043E\u043D\u0438 \u0434\u043E\u043F\u043E\u043C\u0430\u0433\u0430\u044E\u0442\u044C \u0432\u0434\u043E\u0441\u043A\u043E\u043D\u0430\u043B\u044E\u0432\u0430\u0442\u0438 \u0421\u0430\u0439\u0442.</p><p>\u0421\u0430\u0439\u0442 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u043D\u043E \u043D\u0435 \u0437\u0431\u0438\u0440\u0430\u0454 \u0436\u043E\u0434\u043D\u043E\u0457 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457, \u0437\u0430 \u0432\u0438\u043D\u044F\u0442\u043A\u043E\u043C \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457, \u0449\u043E \u043C\u0456\u0441\u0442\u0438\u0442\u044C\u0441\u044F \u0443 \u0444\u0430\u0439\u043B\u0430\u0445 cookie.</p><p>\u0424\u0430\u0439\u043B\u0438 cookie (\u0442\u0430\u043A \u0437\u0432\u0430\u043D\u0456 \u00AB\u043A\u0443\u043A\u0456\u00BB) \u0454 \u043A\u043E\u043C\u043F\u2019\u044E\u0442\u0435\u0440\u043D\u0438\u043C\u0438 \u0434\u0430\u043D\u0438\u043C\u0438, \u0437\u043E\u043A\u0440\u0435\u043C\u0430 \u0442\u0435\u043A\u0441\u0442\u043E\u0432\u0438\u043C\u0438 \u0444\u0430\u0439\u043B\u0430\u043C\u0438, \u044F\u043A\u0456 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u044E\u0442\u044C\u0441\u044F \u043D\u0430 \u043A\u0456\u043D\u0446\u0435\u0432\u043E\u043C\u0443 \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u0457 \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0430 \u0421\u0430\u0439\u0442\u0443 \u0442\u0430 \u043F\u0440\u0438\u0437\u043D\u0430\u0447\u0435\u043D\u0456 \u0434\u043B\u044F \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u0430\u043D\u043D\u044F \u0421\u0430\u0439\u0442\u0443. \u0424\u0430\u0439\u043B\u0438 cookie \u0437\u0430\u0437\u0432\u0438\u0447\u0430\u0439 \u043C\u0456\u0441\u0442\u044F\u0442\u044C \u043D\u0430\u0437\u0432\u0443 \u0432\u0435\u0431-\u0441\u0430\u0439\u0442\u0443, \u0437 \u044F\u043A\u043E\u0433\u043E \u0432\u043E\u043D\u0438 \u043F\u043E\u0445\u043E\u0434\u044F\u0442\u044C, \u0447\u0430\u0441 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u043D\u043D\u044F \u043D\u0430 \u043A\u0456\u043D\u0446\u0435\u0432\u043E\u043C\u0443 \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u0457 \u0442\u0430 \u0443\u043D\u0456\u043A\u0430\u043B\u044C\u043D\u0438\u0439 \u043D\u043E\u043C\u0435\u0440.</p><p>\u0424\u0430\u0439\u043B\u0438 cookie \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u044E\u0442\u044C\u0441\u044F \u0434\u043B\u044F \u0430\u0434\u0430\u043F\u0442\u0430\u0446\u0456\u0457 \u0437\u043C\u0456\u0441\u0442\u0443 \u0421\u0430\u0439\u0442\u0443 \u0434\u043E \u0432\u043F\u043E\u0434\u043E\u0431\u0430\u043D\u044C \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0430 \u0442\u0430 \u043E\u043F\u0442\u0438\u043C\u0456\u0437\u0430\u0446\u0456\u0457 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0421\u0430\u0439\u0442\u043E\u043C; \u0434\u043B\u044F \u0441\u0442\u0432\u043E\u0440\u0435\u043D\u043D\u044F \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0438, \u044F\u043A\u0430 \u0434\u043E\u043F\u043E\u043C\u0430\u0433\u0430\u0454 \u0437\u0440\u043E\u0437\u0443\u043C\u0456\u0442\u0438, \u044F\u043A \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0456 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u044E\u0442\u044C\u0441\u044F \u0421\u0430\u0439\u0442\u043E\u043C, \u0449\u043E \u0434\u043E\u0437\u0432\u043E\u043B\u044F\u0454 \u0432\u0434\u043E\u0441\u043A\u043E\u043D\u0430\u043B\u044E\u0432\u0430\u0442\u0438 \u0439\u043E\u0433\u043E \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u0443 \u0442\u0430 \u0437\u043C\u0456\u0441\u0442.</p><p>\u0412\u0438 \u043C\u043E\u0436\u0435\u0442\u0435 \u0441\u0430\u043C\u043E\u0441\u0442\u0456\u0439\u043D\u043E \u0437\u043C\u0456\u043D\u0438\u0442\u0438 \u043D\u0430\u043B\u0430\u0448\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0449\u043E\u0434\u043E \u0444\u0430\u0439\u043B\u0456\u0432 cookie. \u0423 \u0431\u0430\u0433\u0430\u0442\u044C\u043E\u0445 \u0432\u0438\u043F\u0430\u0434\u043A\u0430\u0445 \u0432\u0435\u0431-\u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0437\u0430 \u0437\u0430\u043C\u043E\u0432\u0447\u0443\u0432\u0430\u043D\u043D\u044F\u043C \u0434\u043E\u0437\u0432\u043E\u043B\u044F\u0454 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u043D\u043D\u044F \u0444\u0430\u0439\u043B\u0456\u0432 cookie \u043D\u0430 \u043A\u0456\u043D\u0446\u0435\u0432\u043E\u043C\u0443 \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u0457 \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0430. \u0414\u0435\u0442\u0430\u043B\u044C\u043D\u0430 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044F \u043F\u0440\u043E \u043C\u043E\u0436\u043B\u0438\u0432\u043E\u0441\u0442\u0456 \u0442\u0430 \u0441\u043F\u043E\u0441\u043E\u0431\u0438 \u043A\u0435\u0440\u0443\u0432\u0430\u043D\u043D\u044F \u0444\u0430\u0439\u043B\u0430\u043C\u0438 cookie \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430 \u0432 \u043D\u0430\u043B\u0430\u0448\u0442\u0443\u0432\u0430\u043D\u043D\u044F\u0445 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043D\u043E\u0433\u043E \u0437\u0430\u0431\u0435\u0437\u043F\u0435\u0447\u0435\u043D\u043D\u044F (\u0432\u0435\u0431-\u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430).</p><p>\u0412\u0456\u0434\u0441\u0443\u0442\u043D\u0456\u0441\u0442\u044C \u0437\u0433\u043E\u0434\u0438 \u043D\u0430 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u0430\u043D\u043D\u044F \u0444\u0430\u0439\u043B\u0456\u0432 cookie \u043C\u043E\u0436\u0435 \u043E\u0431\u043C\u0435\u0436\u0443\u0432\u0430\u0442\u0438 \u0440\u043E\u0431\u043E\u0442\u0443 \u0434\u0435\u044F\u043A\u0438\u0445 \u0444\u0443\u043D\u043A\u0446\u0456\u0439 \u0421\u0430\u0439\u0442\u0443.</p><h2>VII. \u0421\u043E\u0446\u0456\u0430\u043B\u044C\u043D\u0456 \u043F\u043B\u0430\u0433\u0456\u043D\u0438</h2><p>\u041D\u0430 \u0421\u0430\u0439\u0442\u0456 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u044E\u0442\u044C\u0441\u044F \u043F\u043B\u0430\u0433\u0456\u043D\u0438 \u0442\u0430 \u0456\u043D\u0448\u0456 \u0441\u043E\u0446\u0456\u0430\u043B\u044C\u043D\u0456 \u0456\u043D\u0441\u0442\u0440\u0443\u043C\u0435\u043D\u0442\u0438, \u043D\u0430\u0434\u0430\u043D\u0456 \u0442\u0430\u043A\u0438\u043C\u0438 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0430\u043C\u0438, \u044F\u043A Facebook, Google, Instagram, TikTok, LinkedIn. \u041F\u0440\u0430\u0432\u0438\u043B\u0430 \u0449\u043E\u0434\u043E \u043E\u0431\u0440\u043E\u0431\u043A\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445 \u043E\u043F\u0438\u0441\u0430\u043D\u0456 \u0431\u0435\u0437\u043F\u043E\u0441\u0435\u0440\u0435\u0434\u043D\u044C\u043E \u043D\u0430 \u0441\u0430\u0439\u0442\u0430\u0445 \u043F\u043E\u0441\u0442\u0430\u0447\u0430\u043B\u044C\u043D\u0438\u043A\u0456\u0432 \u0446\u0438\u0445 \u0441\u043E\u0446\u0456\u0430\u043B\u044C\u043D\u0438\u0445 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C.</p><h2>VIII. \u0421\u043F\u0456\u043B\u044C\u043D\u0435 \u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0443\u0432\u0430\u043D\u043D\u044F</h2><p>\u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u043E\u043C \u0434\u0430\u043D\u0438\u0445, \u0449\u043E \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u044E\u0442\u044C\u0441\u044F \u0434\u043B\u044F \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0438, \u0437\u0456\u0431\u0440\u0430\u043D\u043E\u0457 \u0432 \u0440\u0430\u043C\u043A\u0430\u0445 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0438 Facebook (Meta), \u0454 Lc Albion Olena Kiriushkina, \u0434\u0430\u043B\u0456 \u2014 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440, \u0442\u0430 Meta Platforms Ireland Limited, \u0437\u0430\u0440\u0435\u0454\u0441\u0442\u0440\u043E\u0432\u0430\u043D\u0430 \u0437\u0430 \u0430\u0434\u0440\u0435\u0441\u043E\u044E 4 Grand Canal Square, Grand Canal Harbour, \u0414\u0443\u0431\u043B\u0456\u043D 2, \u0406\u0440\u043B\u0430\u043D\u0434\u0456\u044F, \u0434\u0430\u043B\u0456 \u2014 \u0421\u043F\u0456\u0432\u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440. \u0426\u0456 \u0434\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u044E\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0441\u043F\u0456\u043B\u044C\u043D\u043E\u0433\u043E \u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0443\u0432\u0430\u043D\u043D\u044F \u0437\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u0438\u043C\u0438 \u0441\u0443\u0431\u2019\u0454\u043A\u0442\u0430\u043C\u0438. \u0414\u0435\u0442\u0430\u043B\u044C\u043D\u0456 \u043F\u0440\u0430\u0432\u0438\u043B\u0430 \u0449\u043E\u0434\u043E \u0441\u043F\u0456\u043B\u044C\u043D\u043E\u0433\u043E \u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0443\u0432\u0430\u043D\u043D\u044F \u0434\u0430\u043D\u0438\u043C\u0438, \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0437 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0454\u044E \u043F\u0440\u043E \u043D\u0430\u043B\u0435\u0436\u043D\u0456 \u043F\u0440\u0430\u0432\u0430, \u043E\u043F\u0438\u0441\u0430\u043D\u0456 \u043D\u0430 \u0441\u0442\u043E\u0440\u0456\u043D\u0446\u0456 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0457 \u043F\u0440\u043E \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0443 \u0441\u0442\u043E\u0440\u0456\u043D\u043A\u0438.</p><p>\u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0454 \u0434\u0430\u043D\u0456 \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443, \u0449\u043E \u043F\u043E\u043B\u044F\u0433\u0430\u0454 \u0443 \u043F\u0440\u043E\u0432\u0435\u0434\u0435\u043D\u043D\u0456 \u0430\u043D\u0430\u043B\u0456\u0437\u0443 \u0430\u043A\u0442\u0438\u0432\u043D\u043E\u0441\u0442\u0456 \u041A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0456\u0432 \u0442\u0430 \u0457\u0445\u043D\u0456\u0445 \u0443\u043F\u043E\u0434\u043E\u0431\u0430\u043D\u044C \u0437 \u043C\u0435\u0442\u043E\u044E \u043F\u043E\u043A\u0440\u0430\u0449\u0435\u043D\u043D\u044F \u0444\u0443\u043D\u043A\u0446\u0456\u043E\u043D\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0456 \u0442\u0430 \u043D\u0430\u0434\u0430\u043D\u0438\u0445 \u043F\u043E\u0441\u043B\u0443\u0433. \u0417 \u043F\u0438\u0442\u0430\u043D\u044C, \u0449\u043E \u0441\u0442\u043E\u0441\u0443\u044E\u0442\u044C\u0441\u044F \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445, \u043C\u043E\u0436\u043D\u0430 \u0437\u0432\u0435\u0440\u0442\u0430\u0442\u0438\u0441\u044F \u044F\u043A \u0434\u043E \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430, \u0442\u0430\u043A \u0456 \u0434\u043E \u0421\u043F\u0456\u0432\u0430\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430.</p><h2>\u0406\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u0439\u043D\u0435 \u0437\u0430\u0441\u0442\u0435\u0440\u0435\u0436\u0435\u043D\u043D\u044F</h2><p>\u0412\u0438\u043A\u043E\u043D\u0443\u044E\u0447\u0438 \u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043E\u043A \u0449\u043E\u0434\u043E \u0456\u043D\u0444\u043E\u0440\u043C\u0443\u0432\u0430\u043D\u043D\u044F, \u0449\u043E \u0432\u0438\u043F\u043B\u0438\u0432\u0430\u0454 \u0437 \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u044C \u0437\u0430\u043A\u043E\u043D\u0443 \u043F\u0440\u043E \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433 \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0438\u043C \u0448\u043B\u044F\u0445\u043E\u043C, \u0430 \u0442\u0430\u043A\u043E\u0436 \u0437\u0430\u043A\u043E\u043D\u0443 \u0432\u0456\u0434 30 \u0442\u0440\u0430\u0432\u043D\u044F 2014 \u0440. \u043F\u0440\u043E \u043F\u0440\u0430\u0432\u0430 \u0441\u043F\u043E\u0436\u0438\u0432\u0430\u0447\u0456\u0432 \u0442\u0430 \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u044C GDPR, \u043D\u0438\u0436\u0447\u0435 \u043D\u0430\u0432\u043E\u0434\u0438\u043C\u043E \u043D\u0430\u0439\u0432\u0430\u0436\u043B\u0438\u0432\u0456\u0448\u0443 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044E.</p><h3>\u041E\u0431\u043E\u0432\u2019\u044F\u0437\u043E\u043A \u0456\u043D\u0444\u043E\u0440\u043C\u0443\u0432\u0430\u043D\u043D\u044F \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E \u0434\u043E GDPR</h3><p>\u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u043E\u043C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445 \u0454 Lc Albion Olena Kiriushkina (NIP: 1251785312, REGON: 541427716), \u0437\u0430\u0440\u0435\u0454\u0441\u0442\u0440\u043E\u0432\u0430\u043D\u0430 \u0437\u0430 \u0430\u0434\u0440\u0435\u0441\u043E\u044E \u0432\u0443\u043B. Kruczej 16/22, \u0412\u0430\u0440\u0448\u0430\u0432\u0430, 00-526, \u041F\u043E\u043B\u044C\u0449\u0430, \u0434\u0430\u043B\u0456 \u2014 \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440. \u0412\u0438 \u043C\u043E\u0436\u0435\u0442\u0435 \u0437\u0432\u2019\u044F\u0437\u0430\u0442\u0438\u0441\u044F \u0437 \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440\u043E\u043C \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u044E \u043F\u043E\u0448\u0442\u043E\u044E: <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u0430\u0431\u043E \u0437\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u043E\u043C: <a href="tel:+48574065884">+48 574 065 884</a>.</p><p>\u0414\u0430\u043D\u0456 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438\u043C\u0443\u0442\u044C\u0441\u044F:</p><ul><li>\u0437 \u043C\u0435\u0442\u043E\u044E \u0443\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u0442\u0430 \u0439\u043E\u0433\u043E \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F (\u0441\u0442. 6(1)(b) GDPR); \u0443 \u0440\u0430\u0437\u0456 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u0434\u043E\u0434\u0430\u0442\u043A\u043E\u0432\u0438\u0445 \u0434\u0430\u043D\u0438\u0445, \u044F\u043A\u0456 \u043C\u043E\u0436\u0443\u0442\u044C \u043F\u043E\u043A\u0440\u0430\u0449\u0438\u0442\u0438 \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u2014 \u043E\u0431\u0440\u043E\u0431\u043A\u0430 \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u0432\u0430\u0442\u0438\u043C\u0435\u0442\u044C\u0441\u044F \u043D\u0430 \u043F\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438 \u0430\u0431\u043E \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F (\u0441\u0442. 6(1)(f) GDPR);</li><li>\u0437 \u043C\u0435\u0442\u043E\u044E \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u043F\u0440\u0430\u0432\u043E\u0432\u043E\u0433\u043E \u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043A\u0443, \u043F\u043E\u043A\u043B\u0430\u0434\u0435\u043D\u043E\u0433\u043E \u043D\u0430 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0441\u0442. 6(1)(c) GDPR), \u0432\u043A\u043B\u044E\u0447\u043D\u043E \u0437 \u043F\u043E\u0434\u0430\u0442\u043A\u043E\u0432\u0438\u043C\u0438 \u0442\u0430 \u0431\u0443\u0445\u0433\u0430\u043B\u0442\u0435\u0440\u0441\u044C\u043A\u0438\u043C\u0438 \u043D\u043E\u0440\u043C\u0430\u043C\u0438, \u0430 \u0442\u0430\u043A\u043E\u0436 \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u043D\u044F\u043C\u0438 \u0437\u0430\u043A\u043E\u043D\u0443 \u0432\u0456\u0434 13 \u0442\u0440\u0430\u0432\u043D\u044F 2016 \u0440. \u043F\u0440\u043E \u043F\u0440\u043E\u0442\u0438\u0434\u0456\u044E \u0437\u0430\u0433\u0440\u043E\u0437\u0430\u043C \u0441\u0435\u043A\u0441\u0443\u0430\u043B\u044C\u043D\u0438\u0445 \u0437\u043B\u043E\u0447\u0438\u043D\u0456\u0432 \u0442\u0430 \u0437\u0430\u0445\u0438\u0441\u0442 \u043D\u0435\u043F\u043E\u0432\u043D\u043E\u043B\u0456\u0442\u043D\u0456\u0445, \u0443 \u0437\u0432\u2019\u044F\u0437\u043A\u0443 \u0437\u0456 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u043D\u043D\u044F\u043C \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430\u0446\u0456\u0457, \u043F\u043E\u0432\u2019\u044F\u0437\u0430\u043D\u043E\u0457 \u0456\u0437 \u0437\u0430\u0445\u043E\u0434\u0430\u043C\u0438 \u0456\u0437 \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u043D\u0435\u043F\u043E\u0432\u043D\u043E\u043B\u0456\u0442\u043D\u0456\u0445, \u0437\u043E\u043A\u0440\u0435\u043C\u0430 \u0449\u043E\u0434\u043E \u043F\u0440\u0438\u0439\u043D\u044F\u0442\u0442\u044F \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u0435\u043D\u044C \u043F\u0440\u043E \u0432\u0438\u043F\u0430\u0434\u043A\u0438 \u0437\u0430\u0433\u0440\u043E\u0437\u0438 \u043D\u0435\u043F\u043E\u0432\u043D\u043E\u043B\u0456\u0442\u043D\u044C\u043E\u043C\u0443 \u0442\u0430 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u0439\u043E\u043C\u0443 \u043F\u0456\u0434\u0442\u0440\u0438\u043C\u043A\u0438, \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0442\u0430 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u043D\u043D\u044F \u0432\u0438\u044F\u0432\u043B\u0435\u043D\u0438\u0445 \u0430\u0431\u043E \u0437\u0430\u044F\u0432\u043B\u0435\u043D\u0438\u0445 \u0456\u043D\u0446\u0438\u0434\u0435\u043D\u0442\u0456\u0432 \u0447\u0438 \u043F\u043E\u0434\u0456\u0439, \u0449\u043E \u0437\u0430\u0433\u0440\u043E\u0436\u0443\u044E\u0442\u044C \u0431\u043B\u0430\u0433\u043E\u043F\u043E\u043B\u0443\u0447\u0447\u044E \u043D\u0435\u043F\u043E\u0432\u043D\u043E\u043B\u0456\u0442\u043D\u044C\u043E\u0433\u043E. \u0426\u0456 \u0437\u0430\u0445\u043E\u0434\u0438 \u0456\u0437 \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u043D\u0435\u043F\u043E\u0432\u043D\u043E\u043B\u0456\u0442\u043D\u0456\u0445 \u0442\u0430\u043A\u043E\u0436 \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u044E\u0442\u044C\u0441\u044F \u0437 \u043C\u0456\u0440\u043A\u0443\u0432\u0430\u043D\u044C \u0432\u0430\u0436\u043B\u0438\u0432\u043E\u0433\u043E \u0441\u0443\u0441\u043F\u0456\u043B\u044C\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E \u0434\u043E \u0441\u0442. 9(2)(b) GDPR;</li><li>\u0437 \u043C\u0435\u0442\u043E\u044E \u0440\u0435\u0430\u043B\u0456\u0437\u0430\u0446\u0456\u0457 \u043F\u0440\u0430\u0432\u043E\u043C\u0456\u0440\u043D\u043E\u0433\u043E \u0456\u043D\u0442\u0435\u0440\u0435\u0441\u0443 \u0410\u0434\u043C\u0456\u043D\u0456\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 (\u0437\u043E\u043A\u0440\u0435\u043C\u0430, \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u0447\u0438 \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0456\u0439/\u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u0432\u0456\u0434 \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0456\u0439/\u043C\u0430\u0440\u043A\u0435\u0442\u0438\u043D\u0433\u0443 \u043F\u043E\u0441\u043B\u0443\u0433 \u0442\u0430 \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u0456\u0432 \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u0432\u0456\u0434\u0433\u0443\u043A\u0456\u0432) \u2014 \u0442\u043E\u0431\u0442\u043E \u0434\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0443 \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F \u0441\u0442\u0440\u043E\u043A\u0443 \u043F\u043E\u0437\u043E\u0432\u043D\u043E\u0457 \u0434\u0430\u0432\u043D\u043E\u0441\u0442\u0456/\u043F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u043B\u043E\u0432\u043E\u0457 \u043C\u0435\u0442\u0438 \u0430\u0431\u043E \u043F\u043E\u0434\u0430\u043D\u043D\u044F \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F.</li></ul><p>\u0414\u043B\u044F \u0434\u043E\u0441\u044F\u0433\u043D\u0435\u043D\u043D\u044F \u0437\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0445 \u0446\u0456\u043B\u0435\u0439 \u0434\u0430\u043D\u0456 \u043C\u043E\u0436\u0443\u0442\u044C \u0431\u0443\u0442\u0438 \u0434\u043E\u0432\u0456\u0440\u0435\u043D\u0456, \u0437\u043E\u043A\u0440\u0435\u043C\u0430, \u0445\u043E\u0441\u0442\u0438\u043D\u0433\u043E\u0432\u0456\u0439 \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0457, \u0449\u043E \u043D\u0430\u0434\u0430\u0454 \u0431\u0443\u0445\u0433\u0430\u043B\u0442\u0435\u0440\u0441\u044C\u043A\u0456 \u043F\u043E\u0441\u043B\u0443\u0433\u0438, \u043E\u0441\u043E\u0431\u0430\u043C, \u044F\u043A\u0456 \u043F\u0440\u043E\u0432\u043E\u0434\u044F\u0442\u044C \u0437\u0430\u043D\u044F\u0442\u0442\u044F, \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0456 \u043E\u0431\u0441\u043B\u0443\u0433\u043E\u0432\u0443\u0432\u0430\u043D\u043D\u044F \u043A\u043B\u0456\u0454\u043D\u0442\u0456\u0432, \u043A\u0443\u0440\u2019\u0454\u0440\u0430\u043C, \u043F\u043E\u0448\u0442\u043E\u0432\u0438\u043C \u0432\u0456\u0434\u0434\u0456\u043B\u0435\u043D\u043D\u044F\u043C, \u044E\u0440\u0438\u0441\u0442\u0443.</p><p>\u0412\u0438 \u043C\u0430\u0454\u0442\u0435 \u043F\u0440\u0430\u0432\u043E \u0432\u0438\u043C\u0430\u0433\u0430\u0442\u0438 \u0434\u043E\u0441\u0442\u0443\u043F\u0443 \u0434\u043E \u0441\u0432\u043E\u0457\u0445 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445, \u0457\u0445 \u0432\u0438\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043D\u044F, \u0432\u0438\u0434\u0430\u043B\u0435\u043D\u043D\u044F \u0430\u0431\u043E \u043E\u0431\u043C\u0435\u0436\u0435\u043D\u043D\u044F \u043E\u0431\u0440\u043E\u0431\u043A\u0438, \u0430 \u0442\u0430\u043A\u043E\u0436 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0443\u0432\u0430\u0442\u0438 \u043F\u0440\u043E\u0442\u0438 \u043E\u0431\u0440\u043E\u0431\u043A\u0438, \u0430 \u0442\u0430\u043A\u043E\u0436 \u043F\u0440\u0430\u0432\u043E \u043D\u0430 \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0435\u043D\u043D\u044F \u0434\u0430\u043D\u0438\u0445 \u0442\u0430 \u043F\u0440\u0430\u0432\u043E \u043F\u043E\u0434\u0430\u0442\u0438 \u0441\u043A\u0430\u0440\u0433\u0443 \u0434\u043E \u043D\u0430\u0433\u043B\u044F\u0434\u043E\u0432\u043E\u0433\u043E \u043E\u0440\u0433\u0430\u043D\u0443. \u0417\u0433\u043E\u0434\u0443 \u043C\u043E\u0436\u043D\u0430 \u0432\u0456\u0434\u043A\u043B\u0438\u043A\u0430\u0442\u0438 \u0432 \u0431\u0443\u0434\u044C-\u044F\u043A\u0438\u0439 \u043C\u043E\u043C\u0435\u043D\u0442 \u0431\u0435\u0437 \u0432\u043F\u043B\u0438\u0432\u0443 \u043D\u0430 \u0437\u0430\u043A\u043E\u043D\u043D\u0456\u0441\u0442\u044C \u043E\u0431\u0440\u043E\u0431\u043A\u0438, \u0437\u0434\u0456\u0439\u0441\u043D\u0435\u043D\u043E\u0457 \u0434\u043E \u0457\u0457 \u0432\u0456\u0434\u043A\u043B\u0438\u043A\u0430\u043D\u043D\u044F. \u0423 \u0442\u0456\u0439 \u043C\u0456\u0440\u0456, \u0432 \u044F\u043A\u0456\u0439 \u043E\u0431\u0440\u043E\u0431\u043A\u0430 \u0434\u0430\u043D\u0438\u0445 \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u0454\u0442\u044C\u0441\u044F \u0437 \u043C\u0435\u0442\u043E\u044E \u0443\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0442\u0430 \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u0430\u0431\u043E \u0434\u043B\u044F \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u043F\u0440\u0430\u0432\u043E\u0432\u0438\u0445 \u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043A\u0456\u0432 \u0447\u0438 \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F/\u043F\u043E\u0434\u0430\u043D\u043D\u044F/\u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u0432\u0456\u0434 \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0456\u0439, \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u0434\u0430\u043D\u0438\u0445 \u0454 \u0434\u043E\u0431\u0440\u043E\u0432\u0456\u043B\u044C\u043D\u0438\u043C, \u0430\u043B\u0435 \u043C\u043E\u0436\u0435 \u0443\u043D\u0435\u043C\u043E\u0436\u043B\u0438\u0432\u0438\u0442\u0438 \u0443\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 (\u0446\u0435 \u043D\u0435 \u0441\u0442\u043E\u0441\u0443\u0454\u0442\u044C\u0441\u044F \u043D\u0435\u043E\u0431\u043E\u0432\u2019\u044F\u0437\u043A\u043E\u0432\u0438\u0445 \u0434\u0430\u043D\u0438\u0445).</p><h3>\u041E\u0431\u043E\u0432\u2019\u044F\u0437\u043E\u043A \u0456\u043D\u0444\u043E\u0440\u043C\u0443\u0432\u0430\u043D\u043D\u044F \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E \u0434\u043E \u0437\u0430\u043A\u043E\u043D\u0443 \u043F\u0440\u043E \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433 \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0438\u043C \u0448\u043B\u044F\u0445\u043E\u043C \u0442\u0430 \u0437\u0430\u043A\u043E\u043D\u0443 \u043F\u0440\u043E \u043F\u0440\u0430\u0432\u0430 \u0441\u043F\u043E\u0436\u0438\u0432\u0430\u0447\u0456\u0432</h3><p>\u041F\u0443\u0431\u043B\u0456\u0447\u043D\u0438\u0439 \u0445\u0430\u0440\u0430\u043A\u0442\u0435\u0440 \u043C\u0435\u0440\u0435\u0436\u0456 \u0406\u043D\u0442\u0435\u0440\u043D\u0435\u0442 \u0442\u0430 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433\u0430\u043C\u0438, \u0449\u043E \u043D\u0430\u0434\u0430\u044E\u0442\u044C\u0441\u044F \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0438\u043C \u0448\u043B\u044F\u0445\u043E\u043C, \u043C\u043E\u0436\u0435 \u0431\u0443\u0442\u0438 \u043F\u043E\u0432\u2019\u044F\u0437\u0430\u043D\u0435 \u0437 \u0440\u0438\u0437\u0438\u043A\u043E\u043C \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u0442\u0430 \u0437\u043C\u0456\u043D\u0438 \u0434\u0430\u043D\u0438\u0445 \u043D\u0435\u0443\u043F\u043E\u0432\u043D\u043E\u0432\u0430\u0436\u0435\u043D\u0438\u043C\u0438 \u043E\u0441\u043E\u0431\u0430\u043C\u0438, \u0442\u043E\u043C\u0443 \u0441\u043B\u0456\u0434 \u0437\u0430\u0441\u0442\u043E\u0441\u043E\u0432\u0443\u0432\u0430\u0442\u0438 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u0456 \u0442\u0435\u0445\u043D\u0456\u0447\u043D\u0456 \u0437\u0430\u0441\u043E\u0431\u0438 \u0434\u043B\u044F \u043C\u0456\u043D\u0456\u043C\u0456\u0437\u0430\u0446\u0456\u0457 \u043E\u043F\u0438\u0441\u0430\u043D\u0438\u0445 \u0440\u0438\u0437\u0438\u043A\u0456\u0432, \u0437\u043E\u043A\u0440\u0435\u043C\u0430 \u0430\u043D\u0442\u0438\u0432\u0456\u0440\u0443\u0441\u043D\u0456 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u0438 \u0442\u0430 \u0437\u0430\u0441\u043E\u0431\u0438 \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u0438\u0445 \u0434\u0430\u043D\u0438\u0445. \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440 \u043D\u0456\u043A\u043E\u043B\u0438 \u043D\u0435 \u0437\u0432\u0435\u0440\u0442\u0430\u0454\u0442\u044C\u0441\u044F \u0437 \u043F\u0440\u043E\u0445\u0430\u043D\u043D\u044F\u043C \u043D\u0430\u0434\u0430\u0442\u0438 \u0439\u043E\u043C\u0443 \u041F\u0430\u0440\u043E\u043B\u044C \u0443 \u0431\u0443\u0434\u044C-\u044F\u043A\u0456\u0439 \u0444\u043E\u0440\u043C\u0456. \u0423 \u0440\u0430\u043C\u043A\u0430\u0445 \u043D\u0430\u0434\u0430\u043D\u0438\u0445 \u043F\u043E\u0441\u043B\u0443\u0433 \u0434\u0456\u0454 \u0437\u0430\u0431\u043E\u0440\u043E\u043D\u0430 \u043D\u0430 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u0440\u043E\u0442\u0438\u043F\u0440\u0430\u0432\u043D\u043E\u0433\u043E \u043A\u043E\u043D\u0442\u0435\u043D\u0442\u0443. \u0421\u043A\u0430\u0440\u0433\u0438 \u0449\u043E\u0434\u043E \u043F\u043E\u0441\u043B\u0443\u0433, \u0449\u043E \u043D\u0430\u0434\u0430\u044E\u0442\u044C\u0441\u044F \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0438\u043C \u0448\u043B\u044F\u0445\u043E\u043C, \u043C\u043E\u0436\u043D\u0430 \u043D\u0430\u0434\u0441\u0438\u043B\u0430\u0442\u0438 \u043D\u0430 \u0430\u0434\u0440\u0435\u0441\u0443 \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440\u0430.</p><p>\u041F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u044F\u0454\u043C\u043E, \u0449\u043E \u0443 \u0440\u0430\u0437\u0456 \u0443\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u043D\u0430 \u0432\u0456\u0434\u0441\u0442\u0430\u043D\u0456 \u0430\u0431\u043E \u043F\u043E\u0437\u0430 \u043C\u0456\u0441\u0446\u0435\u043C \u0440\u043E\u0437\u0442\u0430\u0448\u0443\u0432\u0430\u043D\u043D\u044F \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440\u0430, \u041A\u043B\u0456\u0454\u043D\u0442\u0443, \u044F\u043A\u0438\u0439 \u0454 \u0441\u043F\u043E\u0436\u0438\u0432\u0430\u0447\u0435\u043C \u0430\u0431\u043E \u043F\u0456\u0434\u043F\u0440\u0438\u0454\u043C\u0446\u0435\u043C \u0456\u0437 \u043F\u0440\u0430\u0432\u0430\u043C\u0438 \u0441\u043F\u043E\u0436\u0438\u0432\u0430\u0447\u0430 \u0443 \u0440\u043E\u0437\u0443\u043C\u0456\u043D\u043D\u0456 \u0441\u0442\u0430\u0442\u0442\u0456 385\u2075 \u0426\u0438\u0432\u0456\u043B\u044C\u043D\u043E\u0433\u043E \u043A\u043E\u0434\u0435\u043A\u0441\u0443, \u043D\u0430\u043B\u0435\u0436\u0438\u0442\u044C \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u0435 \u0437\u0430\u043A\u043E\u043D\u043E\u043C \u043F\u0440\u0430\u0432\u043E \u0432\u0456\u0434\u043C\u043E\u0432\u0438\u0442\u0438\u0441\u044F \u0432\u0456\u0434 \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u0431\u0435\u0437 \u043F\u043E\u044F\u0441\u043D\u0435\u043D\u043D\u044F \u043F\u0440\u0438\u0447\u0438\u043D \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C 14 \u0434\u043D\u0456\u0432 \u0437 \u0434\u043D\u044F \u0443\u043A\u043B\u0430\u0434\u0435\u043D\u043D\u044F \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443, \u0437 \u0443\u0440\u0430\u0445\u0443\u0432\u0430\u043D\u043D\u044F\u043C \u043D\u0430\u0432\u0435\u0434\u0435\u043D\u0438\u0445 \u043D\u0438\u0436\u0447\u0435 \u0432\u0438\u043D\u044F\u0442\u043A\u0456\u0432. \u0414\u043B\u044F \u0440\u0435\u0430\u043B\u0456\u0437\u0430\u0446\u0456\u0457 \u043F\u0440\u0430\u0432\u0430 \u043D\u0430 \u0432\u0456\u0434\u043C\u043E\u0432\u0443 \u041A\u043B\u0456\u0454\u043D\u0442 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u044F\u0454 \u043F\u0440\u043E \u0446\u0435, \u043D\u0430\u0434\u0456\u0441\u043B\u0430\u0432\u0448\u0438, \u043D\u0430\u043F\u0440\u0438\u043A\u043B\u0430\u0434, \u0435\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0438\u0439 \u043B\u0438\u0441\u0442 \u0430\u0431\u043E \u043B\u0438\u0441\u0442 \u043D\u0430 \u0430\u0434\u0440\u0435\u0441\u0443 \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440\u0430 (\u0437\u0440\u0430\u0437\u043E\u043A: \u00AB\u0412\u0456\u0434\u043C\u043E\u0432\u043B\u044F\u044E\u0441\u044F \u0432\u0456\u0434 \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u0432\u0456\u0434 \u2026\u00BB). \u0414\u043B\u044F \u0434\u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u0441\u0442\u0440\u043E\u043A\u0443 \u0432\u0430\u0436\u043B\u0438\u0432\u043E \u043D\u0430\u0434\u0456\u0441\u043B\u0430\u0442\u0438 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u0435\u043D\u043D\u044F \u043F\u0440\u043E \u0432\u0456\u0434\u043C\u043E\u0432\u0443 \u0434\u043E \u0439\u043E\u0433\u043E \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F.</p><p>\u041A\u043B\u0456\u0454\u043D\u0442 \u043D\u0435 \u043C\u0430\u0454 \u0432\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043E\u0433\u043E \u0437\u0430\u043A\u043E\u043D\u043E\u043C \u043F\u0440\u0430\u0432\u0430 \u0432\u0456\u0434\u043C\u043E\u0432\u0438\u0442\u0438\u0441\u044F \u0432\u0456\u0434 \u0441\u043F\u0456\u0432\u043F\u0440\u0430\u0446\u0456, \u044F\u043A\u0449\u043E \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440 \u043F\u043E\u0432\u043D\u0456\u0441\u0442\u044E \u0432\u0438\u043A\u043E\u043D\u0430\u0432 \u043F\u043E\u0441\u043B\u0443\u0433\u0443 \u0430\u0431\u043E \u0440\u043E\u0437\u043F\u043E\u0447\u0430\u0432 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433\u0438 \u0437 \u043F\u043E\u0441\u0442\u0430\u0447\u0430\u043D\u043D\u044F \u0446\u0438\u0444\u0440\u043E\u0432\u043E\u0433\u043E \u043A\u043E\u043D\u0442\u0435\u043D\u0442\u0443 \u0437\u0430 \u044F\u0432\u043D\u043E\u044E \u0442\u0430 \u043F\u043E\u043F\u0435\u0440\u0435\u0434\u043D\u044C\u043E\u044E \u0437\u0433\u043E\u0434\u043E\u044E \u041A\u043B\u0456\u0454\u043D\u0442\u0430, \u044F\u043A\u0438\u0439 \u0431\u0443\u0432 \u043F\u043E\u0456\u043D\u0444\u043E\u0440\u043C\u043E\u0432\u0430\u043D\u0438\u0439 \u0434\u043E \u043F\u043E\u0447\u0430\u0442\u043A\u0443 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433\u0438 \u043F\u0440\u043E \u0442\u0435, \u0449\u043E \u043F\u0456\u0441\u043B\u044F \u0457\u0457 \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F \u0432\u0456\u043D \u0432\u0442\u0440\u0430\u0442\u0438\u0442\u044C \u043F\u0440\u0430\u0432\u043E \u043D\u0430 \u0432\u0456\u0434\u043C\u043E\u0432\u0443 \u0432\u0456\u0434 \u0441\u043F\u0456\u0432\u043F\u0440\u0430\u0446\u0456, \u0456 \u0432\u0437\u044F\u0432 \u0446\u0435 \u0434\u043E \u0432\u0456\u0434\u043E\u043C\u0430. \u0423 \u0440\u0430\u0437\u0456 \u043F\u043E\u0441\u043B\u0443\u0433\u0438 \u0437 \u043F\u043E\u0441\u0442\u0430\u0447\u0430\u043D\u043D\u044F \u0446\u0438\u0444\u0440\u043E\u0432\u043E\u0433\u043E \u043A\u043E\u043D\u0442\u0435\u043D\u0442\u0443 \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440 \u043D\u0430\u0434\u0430\u0454 \u041A\u043B\u0456\u0454\u043D\u0442\u0443 \u043F\u0456\u0434\u0442\u0432\u0435\u0440\u0434\u0436\u0435\u043D\u043D\u044F \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u0437\u0433\u043E\u0434\u0438.</p><p>\u0423 \u0440\u0430\u0437\u0456 \u0432\u0456\u0434\u043C\u043E\u0432\u0438 \u0432\u0456\u0434 \u0414\u043E\u0433\u043E\u0432\u043E\u0440\u0443 \u041A\u043B\u0456\u0454\u043D\u0442\u0443 \u0431\u0443\u0434\u0443\u0442\u044C \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u0456 \u0432\u0441\u0456 \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u0456 \u043F\u043B\u0430\u0442\u0435\u0436\u0456 \u043D\u0435\u0432\u0456\u0434\u043A\u043B\u0430\u0434\u043D\u043E, \u0430\u043B\u0435 \u043D\u0435 \u043F\u0456\u0437\u043D\u0456\u0448\u0435 14 \u0434\u043D\u0456\u0432 \u0437 \u0434\u043D\u044F, \u043A\u043E\u043B\u0438 \u041E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0442\u043E\u0440 \u0431\u0443\u0432 \u043F\u043E\u0456\u043D\u0444\u043E\u0440\u043C\u043E\u0432\u0430\u043D\u0438\u0439 \u043F\u0440\u043E \u0432\u0456\u0434\u043C\u043E\u0432\u0443. \u041F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043F\u043B\u0430\u0442\u0435\u0436\u0443 \u0437\u0434\u0456\u0439\u0441\u043D\u044E\u0454\u0442\u044C\u0441\u044F \u0442\u0438\u043C \u0441\u0430\u043C\u0438\u043C \u0441\u043F\u043E\u0441\u043E\u0431\u043E\u043C \u043E\u043F\u043B\u0430\u0442\u0438, \u044F\u043A\u0438\u0439 \u0431\u0443\u0432 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u0430\u043D\u0438\u0439 \u0443 \u043F\u0435\u0440\u0432\u0438\u043D\u043D\u0456\u0439 \u0442\u0440\u0430\u043D\u0437\u0430\u043A\u0446\u0456\u0457, \u044F\u043A\u0449\u043E \u041A\u043B\u0456\u0454\u043D\u0442 \u043F\u0440\u044F\u043C\u043E \u043D\u0435 \u043F\u043E\u0433\u043E\u0434\u0438\u0442\u044C\u0441\u044F \u043D\u0430 \u0456\u043D\u0448\u0435 \u0440\u0456\u0448\u0435\u043D\u043D\u044F; \u041A\u043B\u0456\u0454\u043D\u0442 \u043D\u0435 \u043F\u043E\u043D\u0435\u0441\u0435 \u0436\u043E\u0434\u043D\u0438\u0445 \u0432\u0438\u0442\u0440\u0430\u0442 \u0443 \u0437\u0432\u2019\u044F\u0437\u043A\u0443 \u0437 \u0446\u0438\u043C \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F\u043C.</p><p>\u041A\u043B\u0456\u0454\u043D\u0442 \u043C\u043E\u0436\u0435 \u0437\u0432\u0435\u0440\u043D\u0443\u0442\u0438\u0441\u044F \u0434\u043E \u043F\u043E\u0441\u0442\u0456\u0439\u043D\u043E\u0433\u043E \u0442\u0440\u0435\u0442\u0435\u0439\u0441\u044C\u043A\u043E\u0433\u043E \u0441\u043F\u043E\u0436\u0438\u0432\u0447\u043E\u0433\u043E \u0441\u0443\u0434\u0443 \u0437 \u043F\u0440\u043E\u0445\u0430\u043D\u043D\u044F\u043C \u0432\u0438\u0440\u0456\u0448\u0438\u0442\u0438 \u0441\u043F\u0456\u0440, \u0449\u043E \u0432\u0438\u043D\u0438\u043A \u0456\u0437 \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443, \u0434\u043E \u0432\u043E\u0454\u0432\u043E\u0434\u0441\u044C\u043A\u043E\u0433\u043E \u0456\u043D\u0441\u043F\u0435\u043A\u0442\u043E\u0440\u0430 \u0422\u043E\u0440\u0433\u043E\u0432\u043E\u0457 \u0456\u043D\u0441\u043F\u0435\u043A\u0446\u0456\u0457 \u0437 \u043F\u0440\u043E\u0445\u0430\u043D\u043D\u044F\u043C \u0440\u043E\u0437\u043F\u043E\u0447\u0430\u0442\u0438 \u043C\u0435\u0434\u0456\u0430\u0446\u0456\u0439\u043D\u0435 \u043F\u0440\u043E\u0432\u0430\u0434\u0436\u0435\u043D\u043D\u044F, \u0434\u043E \u043F\u043E\u0432\u0456\u0442\u043E\u0432\u043E\u0433\u043E (\u043C\u0456\u0441\u044C\u043A\u043E\u0433\u043E) \u0443\u043F\u043E\u0432\u043D\u043E\u0432\u0430\u0436\u0435\u043D\u043E\u0433\u043E \u0437 \u043F\u0440\u0430\u0432 \u0441\u043F\u043E\u0436\u0438\u0432\u0430\u0447\u0456\u0432 \u0430\u0431\u043E \u0433\u0440\u043E\u043C\u0430\u0434\u0441\u044C\u043A\u043E\u0457 \u043E\u0440\u0433\u0430\u043D\u0456\u0437\u0430\u0446\u0456\u0457, \u0434\u043E \u0441\u0442\u0430\u0442\u0443\u0442\u043D\u0438\u0445 \u0437\u0430\u0432\u0434\u0430\u043D\u044C \u044F\u043A\u043E\u0457 \u043D\u0430\u043B\u0435\u0436\u0438\u0442\u044C \u0437\u0430\u0445\u0438\u0441\u0442 \u0441\u043F\u043E\u0436\u0438\u0432\u0430\u0447\u0456\u0432, \u0442\u0430 \u043E\u0442\u0440\u0438\u043C\u0430\u0442\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u0443 \u0443 \u0441\u043F\u0440\u0430\u0432\u0456 \u0449\u043E\u0434\u043E \u0434\u043E\u0433\u043E\u0432\u043E\u0440\u0443, \u0430\u0431\u043E \u043C\u0430\u0454 \u043F\u0440\u0430\u0432\u043E \u0441\u043A\u043E\u0440\u0438\u0441\u0442\u0430\u0442\u0438\u0441\u044F \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u043E\u044E ODR (<a href="http://ec.europa.eu/consumers/odr">http://ec.europa.eu/consumers/odr</a>).</p>

