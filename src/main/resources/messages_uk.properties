legal.terms.content=<h2>1. \u041F\u0440\u0438\u0439\u043D\u044F\u0442\u0442\u044F \u0443\u043C\u043E\u0432</h2><p>\u041A\u043E\u0440\u0438\u0441\u0442\u0443\u044E\u0447\u0438\u0441\u044C \u0441\u0430\u0439\u0442\u043E\u043C \u0442\u0430 \u043F\u043E\u0441\u043B\u0443\u0433\u0430\u043C\u0438 Albion EDU, \u0432\u0438 \u043F\u043E\u0433\u043E\u0434\u0436\u0443\u0454\u0442\u0435\u0441\u044C \u0434\u043E\u0442\u0440\u0438\u043C\u0443\u0432\u0430\u0442\u0438\u0441\u044F \u0446\u0438\u0445 \u0423\u043C\u043E\u0432 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433. \u042F\u043A\u0449\u043E \u0432\u0438 \u043D\u0435 \u0437\u0433\u043E\u0434\u043D\u0456 \u0437 \u0431\u0443\u0434\u044C-\u044F\u043A\u043E\u044E \u0447\u0430\u0441\u0442\u0438\u043D\u043E\u044E \u0446\u0438\u0445 \u0443\u043C\u043E\u0432, \u0431\u0443\u0434\u044C \u043B\u0430\u0441\u043A\u0430, \u043D\u0435 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0439\u0442\u0435\u0441\u044F \u043D\u0430\u0448\u0438\u043C\u0438 \u043F\u043E\u0441\u043B\u0443\u0433\u0430\u043C\u0438.</p><h2>2. \u041E\u043F\u0438\u0441 \u043F\u043E\u0441\u043B\u0443\u0433</h2><p>Albion EDU \u043D\u0430\u0434\u0430\u0454 \u043E\u043D\u043B\u0430\u0439\u043D \u0442\u0430 \u0433\u0440\u0443\u043F\u043E\u0432\u0456 \u043C\u043E\u0432\u043D\u0456 \u043A\u0443\u0440\u0441\u0438 \u0437 \u0430\u043D\u0433\u043B\u0456\u0439\u0441\u044C\u043A\u043E\u0457, \u043F\u043E\u043B\u044C\u0441\u044C\u043A\u043E\u0457 \u0442\u0430 \u0443\u043A\u0440\u0430\u0457\u043D\u0441\u044C\u043A\u043E\u0457 \u043C\u043E\u0432, \u0430 \u0442\u0430\u043A\u043E\u0436 \u043F\u043E\u0432\u2019\u044F\u0437\u0430\u043D\u0456 \u043D\u0430\u0432\u0447\u0430\u043B\u044C\u043D\u0456 \u043C\u0430\u0442\u0435\u0440\u0456\u0430\u043B\u0438, \u043A\u043E\u043D\u0442\u0435\u043D\u0442 \u0431\u043B\u043E\u0433\u0443 \u0442\u0430 \u043C\u0430\u0433\u0430\u0437\u0438\u043D \u043D\u0430\u0432\u0447\u0430\u043B\u044C\u043D\u0438\u0445 \u0440\u0435\u0441\u0443\u0440\u0441\u0456\u0432.</p><h2>3. \u0420\u0435\u0454\u0441\u0442\u0440\u0430\u0446\u0456\u044F \u043E\u0431\u043B\u0456\u043A\u043E\u0432\u043E\u0433\u043E \u0437\u0430\u043F\u0438\u0441\u0443</h2><p>\u0414\u043B\u044F \u0434\u043E\u0441\u0442\u0443\u043F\u0443 \u0434\u043E \u043F\u0435\u0432\u043D\u0438\u0445 \u0444\u0443\u043D\u043A\u0446\u0456\u0439 \u0432\u0430\u043C \u043F\u043E\u0442\u0440\u0456\u0431\u043D\u043E \u0441\u0442\u0432\u043E\u0440\u0438\u0442\u0438 \u043E\u0431\u043B\u0456\u043A\u043E\u0432\u0438\u0439 \u0437\u0430\u043F\u0438\u0441. \u0412\u0438 \u043D\u0435\u0441\u0435\u0442\u0435 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0430\u043B\u044C\u043D\u0456\u0441\u0442\u044C \u0437\u0430 \u043A\u043E\u043D\u0444\u0456\u0434\u0435\u043D\u0446\u0456\u0439\u043D\u0456\u0441\u0442\u044C \u0441\u0432\u043E\u0457\u0445 \u043E\u0431\u043B\u0456\u043A\u043E\u0432\u0438\u0445 \u0434\u0430\u043D\u0438\u0445 \u0442\u0430 \u0437\u0430 \u0432\u0441\u0456 \u0434\u0456\u0457, \u0449\u043E \u0432\u0456\u0434\u0431\u0443\u0432\u0430\u044E\u0442\u044C\u0441\u044F \u043F\u0456\u0434 \u0432\u0430\u0448\u0438\u043C \u0430\u043A\u0430\u0443\u043D\u0442\u043E\u043C. \u0412\u0438 \u043F\u043E\u0433\u043E\u0434\u0436\u0443\u0454\u0442\u0435\u0441\u044C \u043D\u0430\u0434\u0430\u0432\u0430\u0442\u0438 \u0442\u043E\u0447\u043D\u0443 \u0442\u0430 \u043F\u043E\u0432\u043D\u0443 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044E \u043F\u0456\u0434 \u0447\u0430\u0441 \u0440\u0435\u0454\u0441\u0442\u0440\u0430\u0446\u0456\u0457.</p><h2>4. \u0417\u0430\u043F\u0438\u0441 \u043D\u0430 \u043A\u0443\u0440\u0441 \u0442\u0430 \u043E\u043F\u043B\u0430\u0442\u0430</h2><ul><li>\u0426\u0456\u043D\u0438 \u043D\u0430 \u043A\u0443\u0440\u0441\u0438 \u0442\u0430 \u043C\u0430\u0442\u0435\u0440\u0456\u0430\u043B\u0438 \u0432\u043A\u0430\u0437\u0430\u043D\u0456 \u043D\u0430 \u043D\u0430\u0448\u043E\u043C\u0443 \u0441\u0430\u0439\u0442\u0456 \u0442\u0430 \u043C\u043E\u0436\u0443\u0442\u044C \u0437\u043C\u0456\u043D\u044E\u0432\u0430\u0442\u0438\u0441\u044F \u0432 \u0431\u0443\u0434\u044C-\u044F\u043A\u0438\u0439 \u0447\u0430\u0441.</li><li>\u041E\u043F\u043B\u0430\u0442\u0430 \u043C\u0430\u0454 \u0431\u0443\u0442\u0438 \u0437\u0434\u0456\u0439\u0441\u043D\u0435\u043D\u0430 \u0434\u043E \u043E\u0442\u0440\u0438\u043C\u0430\u043D\u043D\u044F \u0434\u043E\u0441\u0442\u0443\u043F\u0443 \u0434\u043E \u043A\u0443\u0440\u0441\u0443 \u0447\u0438 \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u0443, \u044F\u043A\u0449\u043E \u0456\u043D\u0448\u0435 \u043D\u0435 \u0443\u0437\u0433\u043E\u0434\u0436\u0435\u043D\u043E.</li><li>\u0412\u0438 \u043D\u0435\u0441\u0435\u0442\u0435 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0430\u043B\u044C\u043D\u0456\u0441\u0442\u044C \u0437\u0430 \u0431\u0443\u0434\u044C-\u044F\u043A\u0456 \u043A\u043E\u043C\u0456\u0441\u0456\u0457, \u0449\u043E \u0441\u0442\u044F\u0433\u0443\u044E\u0442\u044C\u0441\u044F \u0432\u0430\u0448\u0438\u043C \u0431\u0430\u043D\u043A\u043E\u043C \u0430\u0431\u043E \u043F\u043B\u0430\u0442\u0456\u0436\u043D\u0438\u043C \u043F\u0440\u043E\u0432\u0430\u0439\u0434\u0435\u0440\u043E\u043C.</li></ul><h2>5. \u041F\u0440\u0430\u0432\u0438\u043B\u0430 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u043D\u043D\u044F</h2><p>\u041A\u043E\u0440\u0438\u0441\u0442\u0443\u044E\u0447\u0438\u0441\u044C \u043D\u0430\u0448\u0438\u043C\u0438 \u043F\u043E\u0441\u043B\u0443\u0433\u0430\u043C\u0438, \u0432\u0438 \u043F\u043E\u0433\u043E\u0434\u0436\u0443\u0454\u0442\u0435\u0441\u044C \u043D\u0435:</p><ul><li>\u041F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438 \u0434\u043E\u0441\u0442\u0443\u043F \u0434\u043E \u0441\u0432\u043E\u0433\u043E \u0430\u043A\u0430\u0443\u043D\u0442\u0430 \u0456\u043D\u0448\u0438\u043C \u043E\u0441\u043E\u0431\u0430\u043C</li><li>\u041A\u043E\u043F\u0456\u044E\u0432\u0430\u0442\u0438, \u043F\u043E\u0448\u0438\u0440\u044E\u0432\u0430\u0442\u0438 \u0447\u0438 \u043F\u0435\u0440\u0435\u043F\u0440\u043E\u0434\u0430\u0432\u0430\u0442\u0438 \u043D\u0430\u0432\u0447\u0430\u043B\u044C\u043D\u0456 \u043C\u0430\u0442\u0435\u0440\u0456\u0430\u043B\u0438 \u0431\u0435\u0437 \u0434\u043E\u0437\u0432\u043E\u043B\u0443</li><li>\u0412\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0432\u0430\u0442\u0438 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0443 \u0434\u043B\u044F \u0431\u0443\u0434\u044C-\u044F\u043A\u0438\u0445 \u043F\u0440\u043E\u0442\u0438\u0437\u0430\u043A\u043E\u043D\u043D\u0438\u0445 \u0446\u0456\u043B\u0435\u0439</li><li>\u041F\u043E\u0440\u0443\u0448\u0443\u0432\u0430\u0442\u0438 \u0431\u0435\u0437\u043F\u0435\u043A\u0443 \u0447\u0438 \u0444\u0443\u043D\u043A\u0446\u0456\u043E\u043D\u0443\u0432\u0430\u043D\u043D\u044F \u043D\u0430\u0448\u043E\u0433\u043E \u0441\u0430\u0439\u0442\u0443</li></ul><h2>6. \u0406\u043D\u0442\u0435\u043B\u0435\u043A\u0442\u0443\u0430\u043B\u044C\u043D\u0430 \u0432\u043B\u0430\u0441\u043D\u0456\u0441\u0442\u044C</h2><p>\u0423\u0441\u0456 \u043D\u0430\u0432\u0447\u0430\u043B\u044C\u043D\u0456 \u043C\u0430\u0442\u0435\u0440\u0456\u0430\u043B\u0438, \u0442\u0435\u043A\u0441\u0442\u0438, \u0432\u0456\u0434\u0435\u043E, \u043B\u043E\u0433\u043E\u0442\u0438\u043F\u0438 \u0442\u0430 \u043A\u043E\u043D\u0442\u0435\u043D\u0442, \u043D\u0430\u0434\u0430\u043D\u0456 Albion EDU, \u0437\u0430\u0445\u0438\u0449\u0435\u043D\u0456 \u0430\u0432\u0442\u043E\u0440\u0441\u044C\u043A\u0438\u043C \u043F\u0440\u0430\u0432\u043E\u043C \u0456 \u0437\u0430\u043B\u0438\u0448\u0430\u044E\u0442\u044C\u0441\u044F \u043D\u0430\u0448\u043E\u044E \u0432\u043B\u0430\u0441\u043D\u0456\u0441\u0442\u044E \u0430\u0431\u043E \u0432\u043B\u0430\u0441\u043D\u0456\u0441\u0442\u044E \u043D\u0430\u0448\u0438\u0445 \u043B\u0456\u0446\u0435\u043D\u0437\u0456\u0430\u0440\u0456\u0432. \u0412\u0438 \u043C\u043E\u0436\u0435\u0442\u0435 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0432\u0430\u0442\u0438 \u0457\u0445 \u043B\u0438\u0448\u0435 \u0434\u043B\u044F \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u0438\u0445, \u043D\u0435\u043A\u043E\u043C\u0435\u0440\u0446\u0456\u0439\u043D\u0438\u0445 \u043D\u0430\u0432\u0447\u0430\u043B\u044C\u043D\u0438\u0445 \u0446\u0456\u043B\u0435\u0439.</p><h2>7. \u0421\u043A\u0430\u0441\u0443\u0432\u0430\u043D\u043D\u044F \u0442\u0430 \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0435\u043D\u043D\u044F \u0437\u0430\u043D\u044F\u0442\u044C</h2><p>\u041F\u0440\u0430\u0432\u0438\u043B\u0430 \u0441\u043A\u0430\u0441\u0443\u0432\u0430\u043D\u043D\u044F \u0442\u0430 \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0435\u043D\u043D\u044F \u0437\u0430\u043D\u044F\u0442\u044C \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u044F\u044E\u0442\u044C\u0441\u044F \u043F\u0456\u0434 \u0447\u0430\u0441 \u0431\u0440\u043E\u043D\u044E\u0432\u0430\u043D\u043D\u044F. \u0414\u0435\u0442\u0430\u043B\u044C\u043D\u0456\u0448\u0435 \u043F\u0440\u043E \u0441\u043A\u0430\u0441\u0443\u0432\u0430\u043D\u043D\u044F \u0442\u0430 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432 \u0434\u0438\u0432\u0456\u0442\u044C\u0441\u044F \u0432 \u043D\u0430\u0448\u0456\u0439 \u041F\u043E\u043B\u0456\u0442\u0438\u0446\u0456 \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043A\u043E\u0448\u0442\u0456\u0432.</p><h2>8. \u041E\u0431\u043C\u0435\u0436\u0435\u043D\u043D\u044F \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0456</h2><p>Albion EDU \u043F\u0440\u0430\u0433\u043D\u0435 \u043D\u0430\u0434\u0430\u0432\u0430\u0442\u0438 \u0442\u043E\u0447\u043D\u0438\u0439 \u0442\u0430 \u044F\u043A\u0456\u0441\u043D\u0438\u0439 \u043D\u0430\u0432\u0447\u0430\u043B\u044C\u043D\u0438\u0439 \u043A\u043E\u043D\u0442\u0435\u043D\u0442, \u0430\u043B\u0435 \u043D\u0435 \u0433\u0430\u0440\u0430\u043D\u0442\u0443\u0454 \u043A\u043E\u043D\u043A\u0440\u0435\u0442\u043D\u0438\u0445 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u0456\u0432 \u043D\u0430\u0432\u0447\u0430\u043D\u043D\u044F. \u041C\u0438 \u043D\u0435 \u043D\u0435\u0441\u0435\u043C\u043E \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0456 \u0437\u0430 \u0431\u0443\u0434\u044C-\u044F\u043A\u0456 \u043D\u0435\u043F\u0440\u044F\u043C\u0456, \u0432\u0438\u043F\u0430\u0434\u043A\u043E\u0432\u0456 \u0447\u0438 \u043F\u043E\u0431\u0456\u0447\u043D\u0456 \u0437\u0431\u0438\u0442\u043A\u0438, \u0449\u043E \u0432\u0438\u043D\u0438\u043A\u0430\u044E\u0442\u044C \u0443\u043D\u0430\u0441\u043B\u0456\u0434\u043E\u043A \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u0430\u043D\u043D\u044F \u043D\u0430\u0448\u0438\u0445 \u043F\u043E\u0441\u043B\u0443\u0433.</p><h2>9. \u041F\u0440\u0438\u043F\u0438\u043D\u0435\u043D\u043D\u044F \u0434\u0456\u0457</h2><p>\u041C\u0438 \u0437\u0430\u043B\u0438\u0448\u0430\u0454\u043C\u043E \u0437\u0430 \u0441\u043E\u0431\u043E\u044E \u043F\u0440\u0430\u0432\u043E \u043F\u0440\u0438\u0437\u0443\u043F\u0438\u043D\u0438\u0442\u0438 \u0430\u0431\u043E \u0437\u0430\u043A\u0440\u0438\u0442\u0438 \u0432\u0430\u0448 \u043E\u0431\u043B\u0456\u043A\u043E\u0432\u0438\u0439 \u0437\u0430\u043F\u0438\u0441 \u0443 \u0440\u0430\u0437\u0456 \u043F\u043E\u0440\u0443\u0448\u0435\u043D\u043D\u044F \u0446\u0438\u0445 \u0423\u043C\u043E\u0432 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433 \u0430\u0431\u043E \u043F\u043E\u0432\u0435\u0434\u0456\u043D\u043A\u0438, \u044F\u043A\u0443 \u043C\u0438 \u043D\u0430 \u0432\u043B\u0430\u0441\u043D\u0438\u0439 \u0440\u043E\u0437\u0441\u0443\u0434 \u0432\u0438\u0437\u043D\u0430\u0447\u0438\u043C\u043E \u044F\u043A \u0448\u043A\u0456\u0434\u043B\u0438\u0432\u0443 \u0434\u043B\u044F \u0456\u043D\u0448\u0438\u0445 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0456\u0432 \u0447\u0438 \u043D\u0430\u0448\u043E\u0433\u043E \u0431\u0456\u0437\u043D\u0435\u0441\u0443.</p><h2>10. \u0417\u043C\u0456\u043D\u0438 \u0434\u043E \u0446\u0438\u0445 \u0443\u043C\u043E\u0432</h2><p>\u041C\u0438 \u043C\u043E\u0436\u0435\u043C\u043E \u043F\u0435\u0440\u0456\u043E\u0434\u0438\u0447\u043D\u043E \u043E\u043D\u043E\u0432\u043B\u044E\u0432\u0430\u0442\u0438 \u0446\u0456 \u0423\u043C\u043E\u0432\u0438 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433. \u041F\u0440\u043E\u0434\u043E\u0432\u0436\u0435\u043D\u043D\u044F \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u043D\u0430\u0448\u0438\u043C\u0438 \u043F\u043E\u0441\u043B\u0443\u0433\u0430\u043C\u0438 \u043F\u0456\u0441\u043B\u044F \u043F\u0443\u0431\u043B\u0456\u043A\u0430\u0446\u0456\u0457 \u0437\u043C\u0456\u043D \u043E\u0437\u043D\u0430\u0447\u0430\u0454 \u043F\u0440\u0438\u0439\u043D\u044F\u0442\u0442\u044F \u043E\u043D\u043E\u0432\u043B\u0435\u043D\u0438\u0445 \u0443\u043C\u043E\u0432.</p><h2>11. \u0417\u0430\u0441\u0442\u043E\u0441\u043E\u0432\u043D\u0435 \u043F\u0440\u0430\u0432\u043E</h2><p>\u0426\u0456 \u0423\u043C\u043E\u0432\u0438 \u0440\u0435\u0433\u0443\u043B\u044E\u044E\u0442\u044C\u0441\u044F \u0447\u0438\u043D\u043D\u0438\u043C \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0432\u0441\u0442\u0432\u043E\u043C \u044E\u0440\u0438\u0441\u0434\u0438\u043A\u0446\u0456\u0457, \u0443 \u044F\u043A\u0456\u0439 \u0434\u0456\u0454 Albion EDU, \u0431\u0435\u0437 \u0443\u0440\u0430\u0445\u0443\u0432\u0430\u043D\u043D\u044F \u043D\u043E\u0440\u043C \u043A\u043E\u043B\u0456\u0437\u0456\u0439\u043D\u043E\u0433\u043E \u043F\u0440\u0430\u0432\u0430.</p><h2>12. \u041A\u043E\u043D\u0442\u0430\u043A\u0442\u0438</h2><p>\u042F\u043A\u0449\u043E \u0443 \u0432\u0430\u0441 \u0454 \u0437\u0430\u043F\u0438\u0442\u0430\u043D\u043D\u044F \u0449\u043E\u0434\u043E \u0446\u0438\u0445 \u0423\u043C\u043E\u0432 \u043D\u0430\u0434\u0430\u043D\u043D\u044F \u043F\u043E\u0441\u043B\u0443\u0433, \u0437\u0432\u0435\u0440\u0442\u0430\u0439\u0442\u0435\u0441\u044F \u0434\u043E \u043D\u0430\u0441 \u0437\u0430 \u0430\u0434\u0440\u0435\u0441\u043E\u044E <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> \u0430\u0431\u043E \u0437\u0430 \u043D\u043E\u043C\u0435\u0440\u043E\u043C <a href="tel:+48574065884">+48 574 065 884</a>.</p>

