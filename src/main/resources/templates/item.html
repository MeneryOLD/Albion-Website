<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.name}">Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:if="${item.pageHtml != null and !#strings.isEmpty(item.pageHtml)}"
     th:utext="${item.pageHtml}">
</div>

<div th:unless="${item.pageHtml != null and !#strings.isEmpty(item.pageHtml)}">
    <h1 th:text="${item.name}">Item Title</h1>
    <p th:text="${item.description}">Description</p>
</div>

</body>
</html>
