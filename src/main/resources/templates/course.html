<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${course.title}">Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:if="${course.pageHtml != null and !#strings.isEmpty(course.pageHtml)}"
     th:utext="${course.pageHtml}">
</div>

<div th:unless="${course.pageHtml != null and !#strings.isEmpty(course.pageHtml)}">
    <h1 th:text="${course.name}">Course Title</h1>
    <p th:text="${course.description}">Description</p>
</div>

</body>
</html>
