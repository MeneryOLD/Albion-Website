legal.terms.content=<h2>1. Acceptance of Terms</h2><p>By accessing or using the Albion EDU website and services, you agree to be bound by these Terms of Service. If you do not agree with any part of these terms, please do not use our services.</p><h2>2. Description of Services</h2><p>Albion EDU provides online and group language courses in English, Polish, and Ukrainian, along with related educational materials, blog content, and a store for learning resources.</p><h2>3. Account Registration</h2><p>To access certain features, you must create an account. You are responsible for maintaining the confidentiality of your login credentials and for all activities that occur under your account. You agree to provide accurate and complete information when registering.</p><h2>4. Course Enrollment and Payment</h2><ul><li>Prices for courses and materials are listed on our website and may change at any time.</li><li>Payment must be completed before access to a course or product is granted, unless otherwise agreed.</li><li>You are responsible for any fees charged by your bank or payment provider.</li></ul><h2>5. User Conduct</h2><p>When using our services, you agree not to:</p><ul><li>Share your account access with others</li><li>Copy, distribute, or resell course materials without permission</li><li>Use the platform for any unlawful purpose</li><li>Disrupt or interfere with the security or functionality of our website</li></ul><h2>6. Intellectual Property</h2><p>All course materials, texts, videos, logos, and content provided by Albion EDU are protected by copyright and remain our property or the property of our licensors. You may use them only for personal, non-commercial learning purposes.</p><h2>7. Cancellations and Rescheduling</h2><p>Lesson cancellation and rescheduling policies will be communicated to you at the time of booking. Please refer to our Refund Policy for details on cancellations and refunds.</p><h2>8. Limitation of Liability</h2><p>Albion EDU strives to provide accurate and high-quality educational content but does not guarantee specific learning outcomes. We are not liable for any indirect, incidental, or consequential damages arising from your use of our services.</p><h2>9. Termination</h2><p>We reserve the right to suspend or terminate your account if you violate these Terms of Service or engage in conduct that we determine, in our sole discretion, to be harmful to other users or our business.</p><h2>10. Changes to These Terms</h2><p>We may update these Terms of Service from time to time. Continued use of our services after changes are posted constitutes your acceptance of the revised terms.</p><h2>11. Governing Law</h2><p>These Terms are governed by applicable law in the jurisdiction where Albion EDU operates, without regard to conflict of law principles.</p><h2>12. Contact Us</h2><p>If you have questions about these Terms of Service, please contact us at <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> or <a href="tel:+48574065884">+48 574 065 884</a>.</p>

# \u2500\u2500\u2500 REFUND POLICY \u2500\u2500\u2500
legal.refund.pageTitle=Refund Policy \u2014 Albion EDU
legal.refund.title=Refund Policy
legal.refund.updatedDate=August 13, 2026
legal.refund.content=<h2>1. Overview</h2><p>We want you to be satisfied with your learning experience at Albion EDU. This Refund Policy explains the conditions under which refunds may be issued for courses, lessons, and store purchases.</p><h2>2. Individual Lessons</h2><ul><li>If you cancel a scheduled individual lesson at least 24 hours in advance, you may reschedule it at no additional cost.</li><li>Cancellations made less than 24 hours before the lesson may not be eligible for a refund or rescheduling.</li><li>If a lesson is cancelled by the teacher, you will be offered a free rescheduling or a full refund for that lesson.</li></ul><h2>3. Group Courses</h2><ul><li>If you cancel your enrollment before the course begins, you are entitled to a full refund.</li><li>If you cancel within the first week after the course starts, a partial refund may be issued, minus the cost of lessons already attended.</li><li>Refunds are not available after the first week of a group course has passed.</li></ul><h2>4. Digital Products and Store Purchases</h2><p>Due to the nature of digital content, purchases of downloadable materials, e-books, or digital courses are generally non-refundable once access has been granted, unless the product is defective or significantly not as described.</p><h2>5. How to Request a Refund</h2><p>To request a refund, please contact us at <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> with your order details and the reason for your request. We aim to review and respond to all refund requests within 5 business days.</p><h2>6. Refund Processing</h2><p>Approved refunds will be issued to the original payment method within 5\u201310 business days, depending on your bank or payment provider.</p><h2>7. Exceptions</h2><p>We reserve the right to refuse a refund if we find evidence of abuse of this policy, fraud, or violation of our Terms of Service.</p><h2>8. Changes to This Policy</h2><p>We may update this Refund Policy from time to time. Any changes will be posted on this page with an updated revision date.</p><h2>9. Contact Us</h2><p>If you have any questions about this Refund Policy, please contact us at <a href="mailto:lc.albion@gmail.com">lc.albion@gmail.com</a> or <a href="tel:+48574065884">+48 574 065 884</a>.</p>
