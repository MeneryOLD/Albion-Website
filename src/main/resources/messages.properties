about.teachers.title=Meet Our Teachers
about.teachers.olena.name=Olena
about.teachers.olena.role=Founder \u00b7 English
about.teachers.olena.bio=Olena Kiriushkina, an educator and entrepreneur based in Warsaw, Poland. Olena is the founder and driving force behind LC Albion Olena Kiriushkina, an educational venture dedicated to expanding horizons through specialized instruction. Delivering targeted language instruction designed to help learners build practical communication skills and linguistic confidence
about.teachers.milosz.name=Mi\u0142osz
about.teachers.milosz.role=Native Speaker \u00b7 Polish
about.teachers.milosz.bio=If you are looking for a teacher who is truly invested in your success, look no further than Mi\u0142osz. As an experienced and passionate Polish language tutor, Mi\u0142osz doesn't just teach a language\u2014he opens the door to a whole new culture. Mi\u0142osz deeply cares about the progress of every single person he teaches. He takes your success to heart, supports you through learning challenges, and is genuinely invested in helping you achieve your goals.
about.teachers.maksym.name=Maksym
about.teachers.maksym.role=Certified \u00b7 Ukrainian
about.teachers.maksym.bio=Maksym is a linguist and a Polish language teacher. He works with students at A1\u2013B2 levels. He prepares students for the TELC exam and specializes in prep courses for the State B1 level exam. What is he passionate about? His main interests include Slavic languages, psychiatry, and science as a whole.

about.faq.title=Frequently Asked Questions
about.faq.q1=What levels do you teach?
about.faq.a1=From complete beginner (A1) to advanced (C1/C2). Every new student takes a short placement test so we can find the right group or build the right individual programme.
about.faq.q2=Do you offer online classes?
about.faq.a2=Yes! We run classes both at our centre in Warsaw and fully online via Zoom. The online format follows the exact same curriculum and quality standards as our in-person sessions.
about.faq.q3=How long does it take to see results?
about.faq.a3=Most students notice real progress in their confidence and fluency within 1\u20133 months of regular classes. The exact pace depends on lesson frequency and independent practice \u2014 we guide you every step of the way.
about.faq.q4=Can I switch from a group to individual lessons?
about.faq.a4=Absolutely. Many students start in a group and later add individual sessions for extra focus on specific areas. Just let us know and we will arrange a schedule that fits your goals and budget.
about.faq.q5=What is your cancellation policy?
about.faq.a5=You can reschedule or cancel a lesson free of charge with at least 24 hours' notice. Late cancellations or no-shows count as a used lesson. Full details are in our Refund Policy.

# ===== REVIEWS (Home page slider) =====
reviews.review1.text=It's a great luck to learn from a person who is not just passionate about their work, but also knows how to ignite their students. Huge thanks to the talented inspirer and motivator Olena K. for the discovery that learning English can be so interesting \ud83d\udd25
reviews.review1.author=Viktoriia
reviews.review2.text=Lessons with Olena are pure pleasure! She mixes teaching basics of the language with some fun bits, like listening to songs and translating lyrics that gives a little glimpse of the culture. Every lesson with her just flies by!
reviews.review2.author=Marta
reviews.review3.text=I've been studying at LC Albion school for almost a year. As a busy musician, traditional classroom learning never worked for me, but finding Elena changed that. With her professional approach, flexible online schedule, and ability to make learning genuinely engaging, I'm thrilled with my progress. I highly recommend this school to any motivated student!
reviews.review3.author=Daniil
reviews.review4.text=I want to say Thank you! Once again for those 4 months at your English school. I remembered a lot from school and university, but most importantly, I gained confidence that I can speak English, that it is not scary to explain to a foreigner what I want, even in broken English)) We were in Egypt, there are almost no Russian speakers in the hotel there. All the staff speaks English. I could do it!
reviews.review4.author=Maria
reviews.review5.text=Learning English was difficult for me because teachers had always caused me anxiety. From the first lesson, I felt comfortable with Lena. Her lessons are flexible, practical, and focused on real conversations. She corrects mistakes gently, which helped me overcome my fear and speak more confidently. Online classes are convenient, and group lessons let you meet people from different countries. I sincerely recommend Lena \u2014 it was with her that I finally started speaking English!
reviews.review5.author=Maryna
reviews.review6.text=Lena, I wanted to say a big thank you for the lessons. I really see improvements, even though we haven't been studying for very long. I concluded for myself that you really need to study every day, at least 30 minutes. Otherwise, you won't learn the language.
reviews.review6.author=Kateryna

